name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test discovery ratchet (every test file runs somewhere)
        run: node scripts/check-test-discovery.mjs

      - name: Test
        run: npm test
        env:
          # Mocks only — no live credentials in CI. This flag is belt-and-braces:
          # it keeps the architect phase from ever spawning a real agent process
          # even if a test forgets to inject its own mock.
          FORGE_ARCHITECT_NO_SPAWN: "1"

      - name: UI tests
        run: npm run test:ui

      # W7-C3 (bd forge-opj): forge-ui's *.test.ts files are excluded from
      # forge-ui/tsconfig.json (so `next build` stays off them) and vitest
      # transpiles without typechecking — so until this step, NO tsc project
      # saw them and a type-level pin in a test could never fail any gate.
      # Deliberately its own step, not folded into Build: a test-first branch
      # may legitimately carry a red type pin mid-flight; the gate binds here,
      # at PR time.
      - name: UI tests typecheck
        run: npm run test:ui:typecheck

      - name: Studio lint
        run: node --experimental-strip-types apps/forge/cli.ts studio lint

      - name: Brain lint
        run: node --experimental-strip-types apps/forge/cli.ts brain lint

      - name: Markdown lint
        run: npm run lint

      - name: ADR index check
        run: node scripts/check-adr-index.mjs

      - name: ADR two-way supersedes/amends links
        run: node scripts/check-adr-links.mjs

      - name: Docs shape check (Diataxis tree + the hand-written budget)
        run: node scripts/check-docs-shape.mjs

      - name: Identity check (retired vocabulary)
        run: node scripts/check-identity.mjs

      - name: Request-path sinks ratchet check
        run: node scripts/check-request-path-sinks.mjs

      - name: Raw-fs guarded def-use lint (SEC-04)
        run: node scripts/check-raw-fs-guarded.mjs

      # W7-C3 review (A-M12): a disabled primary CTA must say why. The
      # convention shipped documented and unenforced — ~29 primary CTAs
      # carried neither `data-disabled-reason` nor a `title`.
      - name: Disabled-CTA reason ratchet
        run: node scripts/check-disabled-reason.mjs

      # The three structural ratchets (ADR 046, proposed — parked at H5; the
      # constraints themselves are already on main in docs/roadmaps/1.0.md §0
      # and the blueprint spec §8). Each enforces something §0 stated as prose
      # and nothing checked:
      # the allow-graph, the 800-line file cap, and one owner per production
      # file. All three baseline today's tree and may only shrink; none has a
      # --write-baseline, so tightening is a deliberate, reviewable edit.
      - name: Allow-graph boundary ratchet (ADR 046)
        run: node scripts/check-boundaries.mjs

      - name: File-size cap ratchet (800 lines, 1.0.md §0)
        run: node scripts/check-file-size.mjs

      - name: One owner per production file (QUARRY.md)
        run: node scripts/check-owner.mjs

      - name: Per-package LOC caps (QUARRY.md, bead 5.18)
        run: node scripts/check-package-caps.mjs

      # A dead repo-path citation in a comment or doc — one that named a file
      # since moved or deleted — is the exact silent-rot shape brain-lint and
      # check-docs-claims already close for their own scopes; this closes it
      # for code comments and general prose (bead forge-8vfn.13). Baselines
      # today's findings and may only shrink; `--write` never adds a new one.
      - name: Stale path citations ratchet (bead forge-8vfn.13)
        run: node scripts/check-stale-path-citations.mjs

      # ADR 048 clause 3 — deleting the example package leaves the platform
      # running, proven by execution. The deletion happens in a throwaway `git
      # worktree` and the checkout is asserted untouched either side (bead
      # forge-8vfn.6.10.21), so this is safe anywhere in the job; it stays last
      # by habit. A step rather than a job: the four required contexts are what
      # the merge protocol waits on, and a fifth would change that set without
      # changing what is proven.
      - name: Deletable example factory (ADR 048)
        run: node --experimental-strip-types scripts/factory-deletable.mjs

  # The story suite as the standing UI gate (forge-8vfn.7.6.131): boots
  # `forge studio` (production build; dry-bridge + no-spawn seams — nothing can
  # spawn an agent, touch a git remote or start the daemon) and runs the
  # costless stories, which assert their own DOM-as-metrics invariants per beat.
  # This REPLACES the ui-walkthrough crawl and the dead-path crawl, both deleted
  # with their baselines in 7.6.131: a story states what an operator does and
  # asserts the result, where the crawl could only assert that a route rendered.
  # The token-spending explorer fan-out stays a manual wave gate and is
  # deliberately NOT here.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser download. This job now SAVES and RESTORES the entry
      # itself — until 7.6.131 it shared a key with the ui-walkthrough job so
      # that job's save would hit here, and that job is gone. The key is
      # unchanged deliberately, so a cache written before the retirement is
      # still a hit rather than a cold miss on the first run after it. Missing
      # re-enters the apt path this exists to avoid. `--with-deps` runs an `apt-get update`, which on
      # 2026-09-02 failed for every run on this job — `packages.microsoft.com`
      # returned 403 Forbidden for the runner's azure-cli and ubuntu prod
      # repos ("no longer signed"), so the install exited 100 and the gate went
      # red for a reason wholly outside this repo. On a cache hit chromium is
      # already in ~/.cache/ms-playwright and the ubuntu-latest image carries
      # its OS libs, which is exactly the reasoning the walkthrough job records.
      # The crawl and the story runs themselves are unchanged; only the browser
      # INSTALL is cached, so no gate is weakened.
      - name: Cache Playwright chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium

      - name: Run the harness proof stories
        run: |
          npm run stories -- --story smoke
          npm run stories -- --story proof

      - name: Name stale story artifacts (never red — T1 1283)
        run: node scripts/stories/artifact-staleness.mjs

      - name: Upload story artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stories
          path: demos/stories
          if-no-files-found: warn

