name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # Mocks only — no live credentials in CI. This flag is belt-and-braces:
          # it keeps the architect phase from ever spawning a real agent process
          # even if a test forgets to inject its own mock.
          FORGE_ARCHITECT_NO_SPAWN: "1"

      - name: UI tests
        run: npm run test:ui

      # W7-C3 (bd forge-opj): forge-ui's *.test.ts files are excluded from
      # forge-ui/tsconfig.json (so `next build` stays off them) and vitest
      # transpiles without typechecking — so until this step, NO tsc project
      # saw them and a type-level pin in a test could never fail any gate.
      # Deliberately its own step, not folded into Build: a test-first branch
      # may legitimately carry a red type pin mid-flight; the gate binds here,
      # at PR time.
      - name: UI tests typecheck
        run: npm run test:ui:typecheck

      - name: Studio lint
        run: node --experimental-strip-types orchestrator/cli.ts studio lint

      - name: Brain lint
        run: node --experimental-strip-types orchestrator/cli.ts brain lint

      - name: Markdown lint
        run: npm run lint

      - name: ADR index check
        run: node scripts/check-adr-index.mjs

      - name: Docs claims check
        run: node scripts/check-docs-claims.mjs

      - name: Request-path sinks ratchet check
        run: node scripts/check-request-path-sinks.mjs

      - name: Raw-fs guarded def-use lint (SEC-04)
        run: node scripts/check-raw-fs-guarded.mjs

      # W7-C3 review (A-M12): a disabled primary CTA must say why. The
      # convention shipped documented and unenforced — ~29 primary CTAs
      # carried neither `data-disabled-reason` nor a `title`.
      - name: Disabled-CTA reason ratchet
        run: node scripts/check-disabled-reason.mjs

  # W7-A0 — the UI-walkthrough crawl as a standing gate: boots `forge studio`
  # (production build; dry-bridge + no-spawn seams — nothing can spawn an
  # agent, touch a git remote or start the daemon), crawls every reachable
  # Studio route, and fails on any NEW never-ready page / first-party >=400 /
  # pageerror / console.error versus scripts/ui-walkthrough/baseline.json
  # (the wave-7 known-defect set — lanes SHRINK it, never grow it; the last
  # step fails a PR that adds an entry). The token-spending explorer fan-out
  # (fanout.workflow.js) stays a manual wave gate and is deliberately NOT here.
  ui-walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # W8-F5: full history (fetch-depth: 0), this job only. The "Baseline may
      # only shrink" step below accepts growth ONLY through a stamped
      # `main@<sha>` regeneration whose sha check-baseline-shrinks.mjs now
      # verifies for REAL — it must resolve to a commit AND be an ancestor of
      # origin/$BASE_REF. A shallow (depth-1) checkout cannot answer that
      # ancestry question, so it would refuse even a legitimate regeneration;
      # full history makes the question answerable without a warn-and-continue.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap and independent of the crawl — runs FIRST so a PR that grows the
      # baseline is caught even if the boot/crawl below fails. github.base_ref
      # goes through the environment, never interpolated into the shell
      # (W7-A0-8: expression-in-run is the script-injection pattern).
      - name: Baseline may only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # W8-F5, MEASURED: `--depth=1` here RE-SHALLOWS the full clone above
          # (a .git/shallow graft appears and `git rev-parse
          # --is-shallow-repository` flips to true), which would make the
          # ancestry half of the stamp verification unanswerable in the one job
          # that runs this gate. The checkout already has the whole history —
          # this fetch only needs to update the remote ref.
          git fetch --no-tags origin "$BASE_REF"
          node scripts/ui-walkthrough/check-baseline-shrinks.mjs --against "origin/$BASE_REF"

      # W7-C3: cache the browser download; the slow half of --with-deps is an
      # apt-get run that has hung this job before, so it is paid ONLY on a
      # cache miss (a playwright-core version bump changes the lockfile and
      # therefore the key). On a hit, chromium is already in
      # ~/.cache/ms-playwright and the ubuntu-latest image carries its OS libs.
      - name: Cache Playwright chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium

      - name: Walkthrough crawl (assert against baseline)
        run: npm run ui:walkthrough:gate -- --boot --out _walkthrough/ci
        env:
          FORGE_ARCHITECT_NO_SPAWN: "1"
          FORGE_DRY_BRIDGE: "1"

      # W7-A0-4: a removed baseline entry whose route this crawl never visited is
      # UNPROVEN (CI's clean Studio cannot reach the host-only run/session pages)
      # — printed as a workflow warning, not a failure; the operator-host wave
      # gate runs the same check with --fail-unproven.
      - name: Baseline removals were re-crawled
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ui-walkthrough/check-baseline-shrinks.mjs --against "origin/$BASE_REF" --crawled _walkthrough/ci/crawl.json

      - name: Upload crawl output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-walkthrough
          path: |
            _walkthrough/ci/crawl.json
            _walkthrough/ci/crawl-summary.txt
            _walkthrough/ci/assert.json
            _walkthrough/ci/shots
          if-no-files-found: ignore
          retention-days: 7

  # W7-C3 review (T1 CI-gap ruling) — the dead-path crawler as a standing gate.
  # It was NOT in CI, which is exactly why three structural a11y assertions
  # this PR added to it shipped broken: assertions added to an un-run harness
  # are decoration. It boots `forge studio` the same way the ui-walkthrough
  # job above already does (shared scripts/lib/boot-studio.mjs), sweeps every
  # Studio route TWICE and fails on any dead path, wrong landmark, unresolved
  # skip-link fragment, bare tab title or dead nav link.
  #
  # `ui:journey` deliberately stays OUT: 17 journeys, host-global ports and a
  # full rewrite of demos/e2e/ make it a wave/manual gate, not a per-PR one
  # (recorded in docs/forge-ui-dom-and-harness.md).
  deadpaths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright-core install --with-deps chromium

      - name: Dead-path crawl (every route, twice)
        run: npm run ui:deadpaths
        env:
          FORGE_ARCHITECT_NO_SPAWN: "1"
          FORGE_DRY_BRIDGE: "1"
