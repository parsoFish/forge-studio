name: Docs drift

# Runs the docs-drift skill on a pull request that changes code a published
# page may describe: it maps the changed files to pages through `covers:` and
# comments the claims the code now contradicts (or "no user-facing change").
#
# OFF until the operator enables it. It needs an Anthropic API secret, so the
# job runs only when the repository variable DOCS_DRIFT_ENABLED is 'true' and
# the secret ANTHROPIC_API_KEY is set; otherwise every PR shows it SKIPPED.
# Its hit rate is measured for a month before anyone relies on it (R23).
#
# Hygiene: trusted authors only (OWNER / MEMBER / COLLABORATOR); the PR's text
# is never interpolated into the prompt (the skill reads it as data); a
# `skip-docs-check` label skips the run; read-only tools plus the comment tool;
# the action is pinned to a commit SHA.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/**"
      - "apps/**"
      - "studio/**"
      - "skills/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-drift:
    if: >-
      vars.DOCS_DRIFT_ENABLED == 'true'
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'skip-docs-check')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout first so .claude/skills and scripts/docs-covers.mjs exist.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docs drift
        uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/docs-drift ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(node scripts/docs-covers.mjs:*),Bash(node --experimental-strip-types scripts/skill-event.mjs:*),mcp__github_inline_comment__create_inline_comment"
