<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Studio — End-State Prototype v2</title>
<!-- Mock-only webfont load; product self-hosts or falls back to system (backlog item) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FORGE STUDIO — end-state prototype v2
   Same design DNA as forge-ui/app/globals.css:
   dark steel + ember, hexagon signature, object-type colours
   (project=steel, agent=ember, flow=violet, kb=green, artifact=amber).
   Evolutions: 6-item nav w/ Home dashboard, uniform page shell +
   section sub-nav, unified monitor ledger, hex constellation.
   ============================================================ */

:root {
  --bg: #0b0e14;
  --bg-2: #10151f;
  --panel: #141a26;
  --panel-2: #1a2230;
  --panel-3: #202a3c;
  --line: #28324a;
  --line-2: #39455f;

  --text: #e9eef6;
  --dim: #93a0b4;
  --faint: #5b6779;

  --ember: #ff9e4a;
  --ember-hot: #ff6b35;
  --steel: #5cc8ff;
  --violet: #b78cff;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;

  --c-project: #5cc8ff;
  --c-agent: #ff9e4a;
  --c-flow: #b78cff;
  --c-kb: #4ade80;
  --c-artifact: #fbbf24;

  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, "Cascadia Code", "Fira Code", monospace;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  --hex-clip: polygon(25% 3%, 75% 3%, 98% 50%, 75% 97%, 25% 97%, 2% 50%);
  --nav-h: 56px;
  --subnav-h: 44px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
}
html { scroll-behavior: smooth; }
::selection { background: rgba(255,158,74,.25); color: inherit; }

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
code, .mono { font-family: var(--font-mono); font-size: 12.5px; }
a { color: var(--steel); text-decoration: none; }
a:hover { text-decoration: underline; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-2); }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); }

:is(button, a, [tabindex]):focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- top nav ---------- */
.nav {
  display: flex; align-items: center; gap: 24px;
  height: var(--nav-h); padding: 0 24px;
  background: linear-gradient(180deg, #10151f 0%, #0c1018 100%);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 100;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  letter-spacing: 0.12em; color: var(--text);
  background: none; border: none; padding: 0; cursor: pointer;
}
.brand .hex-mark {
  width: 22px; height: 24px; clip-path: var(--hex-clip);
  background: linear-gradient(135deg, var(--ember) 0%, var(--ember-hot) 100%);
  box-shadow: 0 0 12px rgba(255, 158, 74, 0.5); flex-shrink: 0;
}
.brand .sub { color: var(--faint); font-weight: 400; letter-spacing: 0.04em; font-size: 12px; }
.nav-links { display: flex; gap: 4px; flex: 1; }
.nav-links button {
  font-family: var(--font-display); font-size: 13px; font-weight: 500;
  color: var(--dim); padding: 6px 14px; background: none; border: none;
  border-bottom: 2px solid transparent; border-radius: var(--radius-sm);
  cursor: pointer;
}
.nav-links button:hover { color: var(--text); background: var(--panel-2); }
.nav-links button.active {
  color: var(--ember); border-bottom-color: var(--ember);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}
.mock-flag {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint);
  border: 1px dashed var(--line-2); border-radius: 4px; padding: 3px 8px;
  user-select: none; white-space: nowrap;
}

/* ---------- section sub-nav ---------- */
.subnav {
  display: flex; align-items: center; gap: 2px;
  height: var(--subnav-h); padding: 0 24px;
  background: var(--bg-2); border-bottom: 1px solid var(--line);
  position: sticky; top: var(--nav-h); z-index: 90;
}
.subnav-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--faint); margin-right: 14px;
  display: flex; align-items: center; gap: 7px;
}
.subnav-label .dot { width: 7px; height: 7px; border-radius: 50%; }
.subnav button {
  font-family: var(--font-display); font-size: 12.5px; font-weight: 600;
  color: var(--dim); padding: 5px 13px; background: none; border: none;
  border-radius: 999px; cursor: pointer;
}
.subnav button:hover { color: var(--text); background: var(--panel-2); }
.subnav button.active { color: var(--text); background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.subnav .spacer { flex: 1; }

/* ---------- page shell ---------- */
.page { max-width: 1440px; margin: 0 auto; padding: 26px 28px 80px; }
.page-full { padding: 0; max-width: none; }
.page-head { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head .eyebrow {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 5px;
  display: flex; align-items: center; gap: 8px;
}
.page-head .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; }
.page-head h1 { font-size: 24px; }
.page-head .lede { color: var(--dim); font-size: 13px; margin-top: 5px; max-width: 72ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.section-title {
  display: flex; align-items: center; gap: 10px; margin: 30px 0 12px;
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.section-title .count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-weight: 500; }
.section-title a.see-all, .section-title button.see-all {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--steel);
  background: none; border: none; cursor: pointer; text-transform: none; padding: 0;
}

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-display); font-size: 12px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
}
.panel-body { padding: 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 16px;
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  cursor: pointer; transition: border-color 0.12s, background 0.12s; text-decoration: none;
}
.btn:hover { border-color: var(--faint); background: var(--panel-3); text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, #c2410c 0%, #9a3412 100%); border-color: var(--ember-hot); color: #fff; }
.btn-primary:hover { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); border-color: var(--ember); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn-ghost:hover { color: var(--text); background: var(--panel-2); border-color: transparent; }
.btn-sm { padding: 4px 11px; font-size: 12px; }
.btn .glyph { font-size: 14px; line-height: 1; }

/* ---------- inputs ---------- */
.input, textarea.input {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font-body); font-size: 13px; padding: 8px 11px;
  outline: none; transition: border-color 0.12s;
}
.input:focus, textarea.input:focus { border-color: var(--ember); }
.search-wrap { position: relative; }
.search-wrap .input { padding-left: 30px; }
.search-wrap .search-glyph { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 13px; pointer-events: none; }

/* ---------- badges / chips / status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.05em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px; border: 1px solid;
}
.badge-project  { color: var(--c-project);  border-color: rgba(92,200,255,.4);  background: rgba(92,200,255,.08); }
.badge-agent    { color: var(--c-agent);    border-color: rgba(255,158,74,.4);  background: rgba(255,158,74,.08); }
.badge-flow     { color: var(--c-flow);     border-color: rgba(183,140,255,.4); background: rgba(183,140,255,.08); }
.badge-kb       { color: var(--c-kb);       border-color: rgba(74,222,128,.4);  background: rgba(74,222,128,.08); }
.badge-artifact { color: var(--c-artifact); border-color: rgba(251,191,36,.4);  background: rgba(251,191,36,.08); }
.badge-dim      { color: var(--dim); border-color: var(--line-2); background: var(--panel-2); }
.badge-ootb {
  color: var(--ember); border-color: rgba(255,158,74,.35); background: rgba(255,158,74,.06);
  display: inline-flex; align-items: center; gap: 5px;
}
.badge-ootb::before {
  content: ''; width: 8px; height: 9px; clip-path: var(--hex-clip);
  background: var(--ember); display: inline-block;
}
.badge-community { color: var(--violet); border-color: rgba(183,140,255,.3); background: rgba(183,140,255,.05); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot[data-status="idle"],
.status-dot[data-status="pending"]  { background: var(--faint); }
.status-dot[data-status="active"]   { background: var(--ember); box-shadow: 0 0 8px rgba(255,158,74,.7); animation: pulse 1.6s ease-in-out infinite; }
.status-dot[data-status="complete"],
.status-dot[data-status="healthy"]  { background: var(--green); }
.status-dot[data-status="retrying"],
.status-dot[data-status="attention"]{ background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
.status-dot[data-status="failed"]   { background: var(--red); }
.status-dot[data-status="gated"]    { background: var(--amber); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

.status-text { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.status-text[data-status="active"]    { color: var(--ember); }
.status-text[data-status="idle"]      { color: var(--faint); }
.status-text[data-status="complete"],
.status-text[data-status="healthy"]   { color: var(--green); }
.status-text[data-status="attention"],
.status-text[data-status="gated"],
.status-text[data-status="retrying"]  { color: var(--amber); }
.status-text[data-status="failed"]    { color: var(--red); }

/* ---------- cards ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.obj-card {
  display: flex; flex-direction: column; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px 14px; cursor: pointer; position: relative; overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  animation: card-in 0.28s ease both; color: var(--text); font-family: var(--font-body); font-size: 14px;
}
.obj-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.55); }
.obj-card[data-type="project"]:hover { border-color: rgba(92,200,255,0.45); }
.obj-card[data-type="agent"]:hover   { border-color: rgba(255,158,74,0.45); }
.obj-card[data-type="flow"]:hover    { border-color: rgba(183,140,255,0.45); }
.obj-card[data-type="kb"]:hover      { border-color: rgba(74,222,128,0.45); }
.obj-card[data-type="artifact"]:hover{ border-color: rgba(251,191,36,0.45); }
.obj-card[data-type="skill"]:hover   { border-color: rgba(183,140,255,0.45); }
.obj-card[data-type="hook"]:hover    { border-color: rgba(248,113,113,0.45); }
.obj-card[data-type="tool"]:hover    { border-color: rgba(92,200,255,0.45); }
.obj-card .card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 9px; }
.obj-card .card-name { font-family: var(--font-display); font-size: 15px; font-weight: 600; flex: 1; line-height: 1.25; }
.obj-card .card-desc {
  font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 0 0 12px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.obj-card .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.card-stat {
  font-family: var(--font-mono); font-size: 11px; color: var(--faint);
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px;
}
@keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* live strip on flow/agent cards */
.live-strip {
  display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 7px 10px;
  background: rgba(255,158,74,0.06); border: 1px solid rgba(255,158,74,0.2); border-radius: var(--radius-sm);
}
.live-strip .what { font-size: 11.5px; color: var(--dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-strip .cost { font-family: var(--font-mono); font-size: 11px; color: var(--ember); white-space: nowrap; }

/* ---------- hex constellation (Home signature) ---------- */
.constellation {
  position: relative; display: flex; flex-wrap: wrap; gap: 10px 8px;
  padding: 20px; justify-content: flex-start;
}
.hex-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; background: none; border: none; cursor: pointer; padding: 0; }
.hex-frame {
  clip-path: var(--hex-clip); padding: 1.5px; background: var(--line-2); display: inline-block;
  transition: transform .15s ease;
}
.hex-cell:hover .hex-frame { transform: translateY(-2px); }
.hex-frame[data-status="active"]   { background: linear-gradient(135deg, var(--ember), var(--ember-hot)); box-shadow: 0 0 18px rgba(255,158,74,.35); }
.hex-frame[data-status="complete"],
.hex-frame[data-status="healthy"]  { background: var(--green); }
.hex-frame[data-status="idle"]     { background: var(--line-2); }
.hex-frame[data-status="retrying"],
.hex-frame[data-status="gated"],
.hex-frame[data-status="attention"]{ background: var(--amber); box-shadow: 0 0 14px rgba(251,191,36,.25); }
.hex-frame[data-status="failed"]   { background: var(--red); }
.hex-inner {
  clip-path: var(--hex-clip); width: 62px; height: 68px; background: var(--panel-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.hex-inner .glyph { font-size: 18px; line-height: 1; }
.hex-inner .mini { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .04em; color: var(--faint); text-transform: uppercase; }
.hex-cell .hex-label {
  font-family: var(--font-mono); font-size: 10px; color: var(--dim);
  max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hex-cell[data-kind="flow"] .hex-inner .glyph { color: var(--c-flow); }
.hex-cell[data-kind="agent"] .hex-inner .glyph { color: var(--c-agent); }

/* ---------- ledger (unified monitor history) ---------- */
.ledger { width: 100%; border-collapse: collapse; }
.ledger th {
  text-align: left; font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  padding: 8px 12px; border-bottom: 1px solid var(--line);
}
.ledger td { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: top; }
.ledger tr:last-child td { border-bottom: none; }
.ledger tr.row-click { cursor: pointer; }
.ledger tr.row-click:hover td { background: var(--panel-2); }
.ledger .t-mono { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.ledger .t-cost { font-family: var(--font-mono); font-size: 11.5px; color: var(--ember); white-space: nowrap; text-align: right; }
.ledger .t-main { color: var(--text); }
.ledger .t-sub { color: var(--faint); font-size: 11.5px; margin-top: 2px; }

/* ---------- monitor layout (flows + agents share it) ---------- */
.monitor { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - var(--nav-h) - var(--subnav-h)); overflow: hidden; }
.monitor-list { border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; }
.monitor-list-head {
  padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  font-family: var(--font-display); font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
  position: sticky; top: 0; background: var(--bg-2); z-index: 5;
  display: flex; align-items: center; gap: 8px;
}
.monitor-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 11px 16px; background: none; border: none; border-bottom: 1px solid var(--line);
  cursor: pointer; text-align: left; color: var(--text); font-family: var(--font-body);
}
.monitor-row:hover { background: var(--panel); }
.monitor-row.selected { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--ember); }
.monitor-row .m-name { font-family: var(--font-display); font-size: 13px; font-weight: 600; flex: 1; }
.monitor-row .m-sub { font-family: var(--font-mono); font-size: 10px; color: var(--faint); display: block; margin-top: 2px; }
.monitor-main { overflow-y: auto; padding: 22px 26px 60px; }

/* ---------- flow canvas ---------- */
.canvas-wrap {
  position: relative; background:
    radial-gradient(ellipse at 30% 20%, rgba(92,200,255,0.03), transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(40,50,74,.35) 24px),
    repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(40,50,74,.35) 24px),
    var(--bg);
  border: 1px solid var(--line); border-radius: var(--radius);
  overflow-x: auto; padding: 30px 26px;
}
.flow-lane { display: flex; align-items: center; gap: 0; min-width: max-content; }
.flow-node {
  background: var(--panel); border: 1.5px solid var(--line-2); border-radius: var(--radius);
  padding: 11px 13px; min-width: 148px; cursor: pointer; position: relative;
  transition: border-color .13s, box-shadow .13s; font-family: var(--font-body); text-align: left; color: var(--text);
}
.flow-node:hover { border-color: var(--faint); }
.flow-node.selected { border-color: var(--ember); box-shadow: 0 0 0 1px rgba(255,158,74,.25), 0 0 18px rgba(255,158,74,.12); }
.flow-node .fn-kind { font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.flow-node .fn-name { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; }
.flow-node .fn-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
.flow-node[data-band]::after {
  content: attr(data-band); position: absolute; top: -9px; right: 10px;
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--violet); background: var(--bg); border: 1px solid rgba(183,140,255,.35);
  border-radius: 3px; padding: 0 5px;
}
.flow-edge { width: 34px; height: 2px; position: relative; flex-shrink: 0;
  background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 10px); }
.flow-edge::after {
  content: ''; position: absolute; right: -1px; top: -3px;
  border-left: 7px solid var(--line-2); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
}
.flow-edge.live { background: repeating-linear-gradient(90deg, var(--ember) 0 6px, transparent 6px 10px); animation: edge-flow 1s linear infinite; }
.flow-edge.live::after { border-left-color: var(--ember); }
@keyframes edge-flow { to { background-position: 10px 0; } }

/* ---------- builder workbench (agents + flows) ---------- */
.workbench { display: grid; grid-template-columns: 270px 1fr 330px; height: calc(100vh - var(--nav-h) - var(--subnav-h)); overflow: hidden; }
.col-left  { border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; background: var(--bg-2); }
.col-left-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.col-left-head h3 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
.catalog-scroll { overflow-y: auto; flex: 1; padding: 8px 0 20px; }
.catalog-group-header {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 8px 14px 5px; font-family: var(--font-display); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint);
  background: none; border: none; cursor: pointer;
}
.catalog-group-header:hover { color: var(--dim); }
.catalog-group-header .chevron { transition: transform 0.18s; font-size: 10px; }
.catalog-group-header.collapsed .chevron { transform: rotate(-90deg); }
.catalog-group-body { padding: 3px 10px 8px; display: flex; flex-wrap: wrap; gap: 5px; }
.catalog-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px;
  font-size: 12px; color: var(--text); cursor: grab; user-select: none;
  transition: border-color 0.12s, transform 0.12s; font-family: var(--font-body);
}
.catalog-chip:hover { border-color: var(--faint); transform: translateY(-1px); }
.catalog-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.dot-skill { background: var(--violet); }
.dot-tool  { background: var(--steel); }
.dot-mcp   { background: var(--steel); box-shadow: 0 0 0 2px rgba(92,200,255,.25); }
.dot-hook  { background: var(--red); }
.dot-template { background: var(--amber); }
.col-center { display: flex; flex-direction: column; overflow-y: auto; background: var(--bg); }
.col-right { border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; background: var(--bg-2); }

.def-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--bg-2); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hex-glyph {
  width: 34px; height: 38px; clip-path: var(--hex-clip);
  background: linear-gradient(135deg, var(--ember) 0%, var(--ember-hot) 100%);
  box-shadow: 0 0 16px rgba(255,158,74,.35); flex-shrink: 0;
}
.hex-glyph[data-type="flow"] { background: linear-gradient(135deg, var(--violet) 0%, #8b5cf6 100%); box-shadow: 0 0 16px rgba(183,140,255,.35); }
.def-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.def-body { padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 20px; flex: 1; }
.field-label {
  display: block; font-family: var(--font-display); font-size: 11px; font-weight: 600;
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px;
}
.drop-zone {
  min-height: 52px; border: 1.5px dashed var(--line-2); border-radius: var(--radius);
  padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; align-content: flex-start;
}
.drop-zone .placeholder { color: var(--faint); font-size: 12px; padding: 6px 4px; font-style: italic; }
.zone-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px;
  font-size: 12px; color: var(--text); border: 1px solid var(--line-2); background: var(--panel-2);
}
.zone-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.zone-chip[data-kind="skill"] { border-color: rgba(183,140,255,.35); background: rgba(183,140,255,.08); }
.zone-chip[data-kind="tool"]  { border-color: rgba(92,200,255,.35); background: rgba(92,200,255,.08); }
.zone-chip[data-kind="mcp"]   { border-color: rgba(92,200,255,.35); background: rgba(92,200,255,.06); }
.zone-chip[data-kind="hook"]  { border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.07); }
.zone-chip[data-kind="template"] { border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.07); }
.zone-chip .x { color: var(--faint); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 1px; }
.zone-chip .x:hover { color: var(--red); }
.zones-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.preview-block { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.preview-block pre {
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65; color: var(--dim);
  padding: 14px 16px; margin: 0; white-space: pre-wrap; word-break: break-word;
}
.yaml-key { color: var(--steel); } .yaml-val { color: var(--text); } .yaml-list { color: var(--violet); } .yaml-sect { color: var(--ember); font-weight: 600; }

.readiness-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.readiness-item { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--dim); padding: 5px 6px; border-radius: var(--radius-sm); }
.readiness-item.ok { color: var(--text); }
.readiness-item .ri-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
.readiness-item.ok .ri-dot { background: var(--green); box-shadow: 0 0 6px rgba(74,222,128,.4); }

/* ---------- kv + misc ---------- */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 12.5px; }
.kv dt { color: var(--faint); }
.kv dd { margin: 0; color: var(--text); }
.muted { color: var(--dim); }
.faint { color: var(--faint); }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 10px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 1100px) { .three-col { grid-template-columns: 1fr; } .two-col { grid-template-columns: 1fr; } .workbench { grid-template-columns: 240px 1fr; } .col-right { display: none; } }
@media (max-width: 820px)  { .monitor { grid-template-columns: 1fr; } .monitor-list { display: none; } }

/* ---------- toast ---------- */
.toast-host { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 999; }
.toast {
  background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--ember);
  border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px;
  box-shadow: var(--shadow); animation: toast-in 0.25s ease; max-width: 380px;
}
.toast.ok { border-left-color: var(--green); }
@keyframes toast-in { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- KB browse ---------- */
.kb-tree { font-family: var(--font-mono); font-size: 12px; line-height: 2; color: var(--dim); }
.kb-tree button { background: none; border: none; color: var(--dim); font: inherit; cursor: pointer; padding: 0 4px; border-radius: 4px; display: block; width: 100%; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kb-tree button:hover { color: var(--text); background: var(--panel-2); }
.kb-tree button.selected { color: var(--c-kb); background: rgba(74,222,128,.07); }
.kb-doc { font-size: 13px; line-height: 1.65; color: var(--dim); }
.kb-doc h3 { color: var(--text); margin: 0 0 8px; font-size: 15px; }
.kb-doc h4 { color: var(--text); margin: 16px 0 6px; font-size: 13px; }
.kb-doc .tag { display: inline-block; font-family: var(--font-mono); font-size: 10px; color: var(--c-kb); background: rgba(74,222,128,.07); border: 1px solid rgba(74,222,128,.25); border-radius: 3px; padding: 0 6px; margin-right: 4px; }
.kb-doc a.wikilink { color: var(--c-kb); border-bottom: 1px dashed rgba(74,222,128,.4); }
.health-meter { display: flex; flex-direction: column; gap: 8px; }
.health-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
.health-row .bar { flex: 1; height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
.health-row .bar span { display: block; height: 100%; border-radius: 3px; }
.health-row .pct { font-family: var(--font-mono); font-size: 11px; color: var(--faint); width: 40px; text-align: right; }

/* ---------- empty state ---------- */
.empty {
  border: 1.5px dashed var(--line-2); border-radius: var(--radius);
  padding: 26px; text-align: center; color: var(--faint); font-size: 13px;
}
.empty .hint { margin-top: 6px; font-size: 12px; }

/* ---------- KB graph (mock of forge-ui KbGraph) ---------- */
.kb-graph-wrap { position: relative; background: var(--bg); border-radius: var(--radius); overflow: hidden; }
.kb-graph-svg { display: block; width: 100%; height: 520px; cursor: grab; }
.kb-graph-toolbar {
  position: absolute; top: 10px; right: 12px; display: flex; gap: 2px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px 6px;
}
.kb-graph-toolbar .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-right: 4px; }
.kb-graph-toolbar button {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--dim);
  background: none; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer;
}
.kb-graph-toolbar button.active { color: var(--c-kb); background: rgba(74,222,128,.08); }
.kb-graph-legend {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 9px 14px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--dim); background: var(--bg-2);
}
.kb-graph-legend .stat { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.kb-graph-legend .stat strong { color: var(--text); }

/* ---------- run detail timeline ---------- */
.run-steps { display: flex; flex-direction: column; }
.run-step { display: grid; grid-template-columns: 26px 1fr max-content; gap: 0 12px; position: relative; padding: 0 0 18px; }
.run-step .rail { position: absolute; left: 12px; top: 18px; bottom: 0; width: 2px; background: var(--line); }
.run-step:last-child .rail { display: none; }
.run-step .knot {
  width: 14px; height: 15px; clip-path: var(--hex-clip); margin-top: 3px; z-index: 1; justify-self: center;
  background: var(--line-2);
}
.run-step .knot[data-status="complete"] { background: var(--green); }
.run-step .knot[data-status="active"] { background: var(--ember); box-shadow: 0 0 10px rgba(255,158,74,.6); }
.run-step .rs-name { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; }
.run-step .rs-note { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.run-step .rs-artifacts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.run-step .rs-cost { font-family: var(--font-mono); font-size: 11.5px; color: var(--ember); }
.finding { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.finding:last-child { border-bottom: none; }
.finding .sev { flex-shrink: 0; }
.finding .sev[data-sev="major"] { color: var(--red); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.07); }
.finding .sev[data-sev="minor"] { color: var(--amber); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.06); }

/* ---------- session surface ---------- */
.session { display: grid; grid-template-columns: minmax(380px, 1fr) minmax(380px, 560px); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .session { grid-template-columns: 1fr; } }
.chat { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.55; }
.msg.agent { background: var(--panel-2); border: 1px solid var(--line-2); align-self: flex-start; }
.msg.operator { background: rgba(92,200,255,.07); border: 1px solid rgba(92,200,255,.25); align-self: flex-end; }
.msg .who { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; display: block; }
.chat-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }

/* ---------- template previews (pure CSS thumbnails) ---------- */
.tpl-thumb {
  height: 96px; border-radius: var(--radius-sm); border: 1px solid var(--line-2);
  background: var(--bg-2); position: relative; overflow: hidden; margin-bottom: 10px; flex-shrink: 0;
}
.tpl-thumb::before, .tpl-thumb::after { content: ''; position: absolute; }
.tpl-thumb[data-kind="html"]::before { inset: 10px 10px auto 10px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--ember) 0 34%, transparent 34%), var(--panel-3); }
.tpl-thumb[data-kind="html"]::after { inset: 30px 10px 10px 10px; border-radius: 3px; background: repeating-linear-gradient(180deg, var(--panel-3) 0 6px, transparent 6px 12px); }
.tpl-thumb[data-kind="video"]::before { inset: 8px; border-radius: 4px; background: var(--panel-3); }
.tpl-thumb[data-kind="video"]::after {
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  border-left: 18px solid var(--ember); border-top: 11px solid transparent; border-bottom: 11px solid transparent;
}
.tpl-thumb[data-kind="shots"]::before { inset: 10px 46% 10px 10px; border-radius: 3px; background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.tpl-thumb[data-kind="shots"]::after { inset: 10px 10px 10px 46%; margin-left: 8px; border-radius: 3px; background: rgba(74,222,128,.14); box-shadow: inset 0 0 0 1px rgba(74,222,128,.35); }
.tpl-thumb[data-kind="mock"]::before { inset: 8px 8px auto 8px; height: 12px; background: var(--panel-3); border-radius: 3px 3px 0 0; }
.tpl-thumb[data-kind="mock"]::after { inset: 24px 8px 8px 8px; background: linear-gradient(90deg, var(--panel-3) 0 26%, transparent 26% 30%, rgba(183,140,255,.12) 30%); border-radius: 0 0 3px 3px; }
.tpl-thumb[data-kind="doc"]::before { inset: 10px 30%; background: repeating-linear-gradient(180deg, var(--panel-3) 0 5px, transparent 5px 11px); }
.tpl-thumb[data-kind="scaffold"]::before { inset: 12px 34% 12px 12px; background: repeating-linear-gradient(180deg, var(--panel-3) 0 7px, transparent 7px 13px); }
.tpl-thumb[data-kind="scaffold"]::after { inset: 12px 12px 12px 68%; clip-path: var(--hex-clip); background: rgba(255,158,74,.25); }
.tpl-thumb[data-kind="brain"]::before { left: 30%; top: 26%; width: 34px; height: 37px; clip-path: var(--hex-clip); background: rgba(74,222,128,.3); }
.tpl-thumb[data-kind="brain"]::after { left: 52%; top: 44%; width: 20px; height: 22px; clip-path: var(--hex-clip); background: rgba(74,222,128,.16); }

/* ---------- KB explore (graph + reader combined) ---------- */
.kb-explore { display: grid; grid-template-columns: 1fr 400px; gap: 16px; margin-top: 16px; align-items: start; }
@media (max-width: 1100px) { .kb-explore { grid-template-columns: 1fr; } }
.kb-reader-list { max-height: 168px; overflow-y: auto; border-bottom: 1px solid var(--line); }

/* ---------- community browser ---------- */
.comm-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 16px; background: none; border: none; border-bottom: 1px solid var(--line);
  text-align: left; color: var(--text); font-family: var(--font-body);
}
.comm-row:last-child { border-bottom: none; }
.comm-row .c-name { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.comm-row .c-desc { font-size: 12px; color: var(--dim); margin-top: 2px; }
.comm-row .c-src { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.comm-kind { width: 64px; flex-shrink: 0; }
.install-btn[data-state="installed"] { color: var(--green); border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.07); cursor: default; }

/* ---------- demo showcase (mock rendered artifact) ---------- */
.showcase { max-width: 980px; margin: 0 auto; }
.showcase-doc { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.showcase-head {
  padding: 22px 26px 18px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,158,74,.05), transparent);
}
.showcase-body { padding: 22px 26px; display: flex; flex-direction: column; gap: 20px; }
.showcase-evidence { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

/* ---------- journey overlay ---------- */
.j-cursor {
  position: fixed; z-index: 10000; width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid var(--ember); background: rgba(255,158,74,.25);
  box-shadow: 0 0 14px rgba(255,158,74,.55); pointer-events: none;
  transition: left .55s cubic-bezier(.45,.05,.35,1), top .55s cubic-bezier(.45,.05,.35,1), opacity .3s;
  transform: translate(-50%, -50%);
  left: 50vw; top: 40vh; opacity: 0;
}
.j-cursor.on { opacity: 1; }
.j-cursor.click { animation: j-click .38s ease; }
@keyframes j-click { 0% { scale: 1; } 40% { scale: 0.6; } 100% { scale: 1; } }
.j-caption {
  position: fixed; z-index: 10000; left: 50%; bottom: 26px; transform: translateX(-50%);
  max-width: 760px; width: max-content; pointer-events: none;
  background: rgba(11,14,20,.92); border: 1px solid var(--line-2); border-left: 3px solid var(--ember);
  border-radius: var(--radius-sm); padding: 12px 20px; box-shadow: var(--shadow);
}
.j-caption .j-title {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ember); margin-bottom: 3px;
}
.j-caption .j-text { font-size: 14.5px; color: var(--text); line-height: 1.45; }
.j-caption .j-step { font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); margin-top: 4px; }

/* ---------- flow node hex identity ---------- */
.fn-hex {
  display: inline-block; width: 11px; height: 12px; clip-path: var(--hex-clip);
  flex-shrink: 0; vertical-align: -1px; margin-right: 6px;
}
.fn-hex[data-kind="agent"] { background: linear-gradient(135deg, var(--ember), var(--ember-hot)); box-shadow: 0 0 6px rgba(255,158,74,.4); }
.fn-hex[data-kind="gate"]  { background: var(--amber); }
.fn-hex[data-kind="queue"] { background: var(--faint); }

/* ---------- input materials (kickoff upload, mocked) ---------- */
.mat-zone {
  border: 1.5px dashed var(--line-2); border-radius: var(--radius);
  padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; cursor: pointer;
  transition: border-color .13s;
}
.mat-zone:hover { border-color: var(--faint); }
.mat-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11.5px;
  color: var(--text); border: 1px solid rgba(251,191,36,.3); background: rgba(251,191,36,.06);
}
.mat-chip .glyph { color: var(--c-artifact); }

/* ---------- node log (run-detail drill-down) ---------- */
.nlog { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.9; padding: 10px 14px; }
.nlog .row { align-items: flex-start; gap: 9px; padding: 2px 0; }
.nlog .tag { flex-shrink: 0; width: 46px; text-align: right; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
.nlog .tag[data-t="think"] { color: var(--violet); }
.nlog .tag[data-t="tool"]  { color: var(--steel); }
.nlog .tag[data-t="out"]   { color: var(--c-artifact); }
.nlog .txt { color: var(--dim); flex: 1; }
.nlog .txt[data-t="out"] { color: var(--text); }

/* ---------- skill package file tree ---------- */
.file-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 6px; }
.file-tab {
  font-family: var(--font-mono); font-size: 10.5px; color: var(--dim);
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 7px 10px; cursor: pointer;
}
.file-tab.active { color: var(--c-artifact); border-bottom-color: var(--c-artifact); }

/* ---------- hex flow nodes (mirrors the real FlowBuilderCanvas) ---------- */
.hexnode {
  display: flex; flex-direction: column; align-items: center; width: 112px;
  background: none; border: none; cursor: pointer; padding: 0; color: inherit; font: inherit;
  flex-shrink: 0;
}
.hexnode-frame {
  clip-path: var(--hex-clip); padding: 1.5px; width: 96px; height: 88px;
  background: var(--line-2); transition: box-shadow .15s, background .15s;
}
.hexnode-frame[data-sel="true"] {
  background: linear-gradient(135deg, var(--ember), var(--ember-hot));
  box-shadow: 0 0 20px rgba(255,158,74,.4);
}
.hexnode-frame[data-live="true"] {
  background: linear-gradient(135deg, var(--ember), var(--ember-hot));
  box-shadow: 0 0 18px rgba(255,158,74,.35);
  animation: pulse 1.6s ease-in-out infinite;
}
.hexnode-inner {
  clip-path: var(--hex-clip); background: var(--panel-2); width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.hexnode-inner .nd { width: 8px; height: 8px; border-radius: 50%; margin-bottom: 2px; }
.hexnode-name {
  font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--text);
  max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
}
.hexnode-badge {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 4px; border-radius: 2px;
}
.hexnode-ref {
  margin-top: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--faint);
  max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hexnode-out { margin-top: 3px; }

/* ---------- DAG lane (columns of parallel nodes + connectors) ---------- */
.dag { display: flex; align-items: center; min-width: max-content; padding: 4px 2px; }
.dag-col { display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.dag-conn { flex-shrink: 0; align-self: center; }
.dag-conn line, .dag-conn path { stroke: var(--line-2); stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
.dag-conn.live line, .dag-conn.live path { stroke: var(--ember); }
.join-badge {
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--amber); background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3);
  border-radius: 3px; padding: 0 5px; margin-top: 3px;
}

/* ---------- roadmap DAG viz ---------- */
.rmdag { display: flex; align-items: center; min-width: max-content; padding: 16px 14px; overflow-x: auto; }
.rmdag .dag-col { gap: 12px; }
.rmnode {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  background: var(--panel-2); border: 1.5px solid var(--line-2); border-radius: var(--radius-sm);
  padding: 7px 11px; min-width: 128px; cursor: pointer; color: inherit; font: inherit; text-align: left;
}
.rmnode:hover { border-color: var(--faint); }
.rmnode[data-s="complete"] { border-color: rgba(74,222,128,.45); }
.rmnode[data-s="active"]   { border-color: var(--ember); box-shadow: 0 0 12px rgba(255,158,74,.18); }
.rmnode .rm-id { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.rmnode .rm-name { font-family: var(--font-display); font-size: 11.5px; font-weight: 600; max-width: 150px; }

/* ---------- trigger chips ---------- */
.trig-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border-radius: 999px; font-family: var(--font-mono); font-size: 10.5px; border: 1px solid;
}
.trig-chip[data-t="manual"]      { color: var(--steel); border-color: rgba(92,200,255,.35); background: rgba(92,200,255,.06); }
.trig-chip[data-t="on-complete"] { color: var(--violet); border-color: rgba(183,140,255,.35); background: rgba(183,140,255,.06); }
.trig-chip[data-t="hook"]        { color: var(--red); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.06); }
.trig-chip .scope { color: var(--faint); }

/* ---------- security scan panel ---------- */
.scan-verdict { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--green); }

/* ---------- roadmap table ---------- */
.rm-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; border: 1px solid; }
.rm-status[data-s="complete"] { color: var(--green); border-color: rgba(74,222,128,.35); background: rgba(74,222,128,.07); }
.rm-status[data-s="active"]   { color: var(--ember); border-color: rgba(255,158,74,.4); background: rgba(255,158,74,.08); }
.rm-status[data-s="pending"]  { color: var(--faint); border-color: var(--line-2); background: var(--panel-2); }
