<style>
:root{
  --bg:#0b0e14; --panel:#141a26; --panel2:#0f1420; --line:#28324a;
  --text:#e9eef6; --dim:#93a0b4; --faint:#5b6779;
  --idle:#6e7681; --active:#1f6feb; --complete:#2ea043; --attention:#d29922; --failed:#f85149;
  --run-link:#4ca3f5; --marker:#a371f7;
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'JetBrains Mono','Cascadia Code',Consolas,monospace;
  --radius:8px; --radius-sm:5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:.01em;text-wrap:balance}
a{color:var(--run-link)}
button{font-family:var(--font-body)}
code,.mono{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);
  background:var(--panel2);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.topbar .brand{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.topbar .brand .accent{color:var(--run-link)}
.topbar nav{display:flex;gap:4px;flex-wrap:wrap}
.topbar nav a{font-size:12px;color:var(--dim);text-decoration:none;padding:4px 10px;border-radius:6px;border:1px solid transparent}
.topbar nav a:hover{color:var(--text);border-color:var(--line)}
.topbar nav a[aria-current="page"]{color:var(--text);background:var(--panel);border-color:var(--line)}
.topbar .spacer{flex:1}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

.mode-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.mode-toggle button{background:none;border:none;color:var(--dim);font-size:11px;font-weight:600;
  padding:5px 12px;cursor:pointer}
.mode-toggle button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;border-radius:4px;padding:2px 7px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* uniform collapsed card — the 280x72 contract */
.icard{width:280px;height:72px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--idle);
  border-radius:var(--radius-sm);padding:8px 10px 7px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;text-align:left;color:var(--text);position:relative;transition:border-color .12s, opacity .12s}
.icard:hover{border-color:var(--faint)}
.icard.selected{border-color:var(--marker);box-shadow:0 0 0 1px var(--marker)}
.icard.neighbor{border-color:var(--run-link)}
.icard.dimmed{opacity:.28}
.icard .t{font-family:var(--font-display);font-size:12px;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .meta{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--faint);font-family:var(--font-mono)}
.icard .meta .st{display:inline-flex;align-items:center;gap:4px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.icard .meta .req{color:var(--attention)}

/* detail panel (drawer / inline expansion / accordion) */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-size:12px}
.detail .dhead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.detail .dhead .t{font-family:var(--font-display);font-size:15px;font-weight:700;line-height:1.3}
.detail .dhead .id{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);margin-top:4px;word-break:break-all}
.detail .dbody{padding:6px 16px 14px;display:flex;flex-direction:column}
.dsec{padding:9px 0;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:none}
.dsec .slabel{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gate{font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--faint);
  border:1px dashed var(--line);border-radius:4px;padding:1px 6px}
.gate.off{color:var(--faint)}
.gate.on{color:var(--complete);border-color:var(--complete)}
.dsec.inactive{opacity:.55}
.dep-chip{display:inline-block;font-family:var(--font-mono);font-size:10px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:0 4px 4px 0;cursor:pointer}
.dep-chip:hover{color:var(--text);border-color:var(--faint)}
.wi-badge{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 9px;margin-bottom:5px}
.wi-badge .wid{font-family:var(--font-mono);font-size:10px;color:var(--run-link);font-weight:700;flex-shrink:0}
.wi-badge .wt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi-badge .wdep{font-family:var(--font-mono);font-size:9px;color:var(--faint);flex-shrink:0}
.run-link{display:block;font-size:11px;color:var(--run-link);text-decoration:underline;margin-bottom:3px;
  font-family:var(--font-mono);word-break:break-all}
.btn{display:inline-block;color:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 14px;
  font-size:12px;font-weight:600;cursor:pointer;background:var(--active)}
.btn.green{background:#238636}
.btn.small{font-size:10px;padding:2px 8px;border:none;border-radius:4px}
.btn.grey{background:var(--line)}
.btn.red{background:#a33}
.notice{font-size:11px;color:var(--attention)}
.recovery-empty{color:var(--faint);font-style:italic;font-size:11px}
.inventory{margin-top:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-sm)}
.inventory .row{display:flex;gap:8px;font-size:10.5px;color:var(--dim);padding:2px 0}
.inventory .row .ok{color:var(--complete);font-weight:700}
.inventory .row code{color:var(--faint);font-size:9.5px}

/* comment markers */
.cm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:var(--marker);color:#0b0e14;font-size:11px;font-weight:800;cursor:pointer;border:none;
  vertical-align:middle;margin:0 3px;flex-shrink:0;font-family:var(--font-mono)}
.cm:hover{box-shadow:0 0 0 3px rgba(163,113,247,.3)}
#cm-pop{position:fixed;z-index:100;max-width:360px;background:var(--panel);border:1px solid var(--marker);
  border-radius:var(--radius);padding:12px 14px;font-size:12px;color:var(--dim);box-shadow:0 8px 30px rgba(0,0,0,.5);display:none}
#cm-pop .pid{font-family:var(--font-mono);font-size:10px;font-weight:800;color:var(--marker);letter-spacing:.05em}
#cm-pop .pq{color:var(--text);font-weight:600;margin:4px 0 6px;font-size:12.5px}
.legend{max-width:900px;margin:40px auto 60px;padding:0 20px}
.legend table{width:100%;border-collapse:collapse;font-size:12px}
.legend th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  padding:6px 10px;border-bottom:1px solid var(--line)}
.legend td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--dim)}
.legend td.q{color:var(--text);font-weight:600}
.legend td.mid{font-family:var(--font-mono);font-weight:800;color:var(--marker);white-space:nowrap}
.provenance{font-size:11px;color:var(--faint);line-height:1.6}
.provenance code{font-size:10px;color:var(--dim)}
.scrollx{overflow-x:auto}


.canvas-toolbar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#viewport{position:relative;height:calc(100vh - 148px);min-height:480px;overflow:hidden;cursor:grab;
  background:radial-gradient(circle at 1px 1px, #1b2333 1px, transparent 1px) 0 0/26px 26px, var(--bg)}
#viewport.panning{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
#edges{position:absolute;overflow:visible;pointer-events:none}
#nodes .icard{position:absolute}
.bnode-expanded{position:absolute;width:400px;z-index:5}
#minimap{position:absolute;right:14px;bottom:14px;width:200px;background:rgba(15,20,32,.92);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;z-index:10}
#minimap .mm-node{position:absolute;border-radius:1px}
#mm-view{position:absolute;border:1px solid var(--marker);background:rgba(163,113,247,.12);pointer-events:none}
#rank-labels{position:absolute;left:0;top:0;pointer-events:none}
.rank-label{position:absolute;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);font-family:var(--font-mono)}
</style>

const TONE = {pending:'var(--idle)','in-flight':'var(--active)','ready-for-review':'var(--attention)',
  merged:'var(--complete)',done:'var(--complete)',failed:'var(--failed)'};
const HUB = 'INIT-2026-07-01-migrate-framework-release-folder-permissions';

// Replay 2026-07-01T09:30Z — statuses reconstructed mid-migration-wave.
// Rules: created before 07-01 -> done (all June cycles had completed; real cycle_ids).
// The 07-01 wave hub (release-folder-permissions) -> done (its dependents were already
// running under cycle 2026-07-01T08-39-27). Wave-internal in-flight/review/failed picks
// are illustrative, but `failed` is only assigned to an initiative that REALLY failed
// (it carries previous_failure_modes: requeued-from-failed). blockedBy is COMPUTED from
// the real dependency edges, mirroring the scheduler's checkInitiativeDeps gate.
const REPLAY_OVERRIDES = {
  'INIT-2026-07-01-migrate-framework-core':'in-flight',
  'INIT-2026-07-01-migrate-framework-build':'in-flight',
  'INIT-2026-07-01-migrate-framework-workitemtracking':'in-flight',
  'INIT-2026-07-01-migrate-framework-feed':'ready-for-review',
  'INIT-2026-07-01-migrate-framework-git':'failed',
};
function replayQueue(d){
  if (REPLAY_OVERRIDES[d.id]) return REPLAY_OVERRIDES[d.id];
  if (d.created < '2026-07-01') return 'done';
  if (d.id === HUB) return 'done';
  return 'pending';                      // rest of the wave + later-authored items
}
function statusOf(d, mode){
  const queue = mode === 'today' ? d.queueDir : replayQueue(d);
  const planned = mode === 'today' ? true : !(queue === 'pending' && d.created > '2026-07-01');
  const doneSet = s => s === 'done' || s === 'merged';
  const blockedBy = queue === 'pending'
    ? d.deps.filter(p => !doneSet(mode === 'today' ? BY_ID[p].queueDir : replayQueue(BY_ID[p])))
    : [];
  return { queue, planned, ready: blockedBy.length === 0, blockedBy };
}
function laneOf(st){
  if (st.queue === 'in-flight' || st.queue === 'ready-for-review' || st.queue === 'failed') return 'progress';
  if (st.queue === 'done' || st.queue === 'merged') return 'done';
  if (!st.planned) return 'unplanned';
  return st.ready ? 'ready' : 'blocked';
}
function slugOf(id){ return id.replace(/^INIT-\d{4}-(\d{2}-\d{2})-/, ''); }
function dateOf(id){ const m = id.match(/^INIT-\d{4}-(\d{2}-\d{2})/); return m ? m[1] : ''; }
function neighborsOf(id){
  const up = new Set(BY_ID[id].deps);
  const down = new Set(DATA.filter(d => d.deps.includes(id)).map(d => d.id));
  return { up, down };
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function cardHTML(d, mode){
  const st = statusOf(d, mode);
  return `<button class="icard" data-roadmap-node data-initiative-id="${d.id}"
    data-initiative-status="${st.queue}" data-plan-state="${st.planned ? 'planned' : 'unplanned'}"
    data-initiative-ready="${st.ready}" data-blocked-by="${esc(st.blockedBy.join(','))}"
    style="border-left-color:${TONE[st.queue]}">
    <span class="t">${esc(d.title)}</span>
    <span class="meta">
      <span class="st" style="color:${TONE[st.queue]}"><span class="dot" style="background:${TONE[st.queue]}"></span>${st.planned ? st.queue : 'unplanned'}</span>

}

function detailHTML(d, mode){
  const st = statusOf(d, mode);
  const recoverable = ['in-flight','ready-for-review','failed'].includes(st.queue);
  const unplanned = !st.planned;
  const canStart = st.queue === 'pending' && st.ready && st.planned;
  const blocked = st.queue === 'pending' && !st.ready;
  const wis = WI_SNAPSHOT[d.id];
  const gate = (active, label) =>
    `<span class="gate ${active ? 'on' : 'off'}">${active ? 'active now' : 'gate: ' + label}</span>`;
  const sec = (active, label, gateLabel, inner) =>
    `<div class="dsec ${active ? '' : 'inactive'}"><div class="slabel">${label} ${gate(active, gateLabel)}</div>${inner}</div>`;

  let h = `<div class="dhead">
    <span class="chip" style="color:${TONE[st.queue]};background:color-mix(in srgb, ${TONE[st.queue]} 12%, transparent)">
      <span class="dot" style="background:${TONE[st.queue]}"></span>${st.queue}</span>
    <div class="t" style="margin-top:8px">${esc(d.title)}</div>
    <div class="id">${d.id}</div>
  </div><div class="dbody">`;

  h += `<div class="dsec"><div class="slabel">Mock convention</div>
    <div style="font-size:11px;color:var(--faint)">Every relocated section is rendered below. In the live UI a
    dashed chip's section only appears when its state gate is met — nothing is click-gated out of the DOM.</div></div>`;

  h += sec(d.deps.length > 0, 'Depends on', 'has prerequisites',
    d.deps.length
      ? d.deps.map(p => `<span class="dep-chip" data-dep-jump="${p}">${slugOf(p)}</span>`).join('')
      : '<span style="color:var(--faint);font-size:11px">none — rank-0 initiative</span>');

  h += sec(blocked, 'Blocked by', 'pending &amp; deps unmet',
    `<div class="notice" data-section="initiative-blocked">${
      st.blockedBy.length ? st.blockedBy.map(slugOf).join(', ') : '(empty when unblocked)'}</div>`);

  h += sec(unplanned, 'Blocked until planned', 'pending &amp; no WI snapshot',
    `<div class="notice" data-section="initiative-blocked-until-planned">Not yet planned — decompose it before starting development.</div>`);

  h += sec(!!wis, 'Work items', 'WI snapshot exists',
    wis
      ? wis.map(w => `<div class="wi-badge" data-work-item-id="${w.id}"><span class="wid">${w.id}</span><span class="wt" title="${esc(w.title)}">${esc(w.title)}</span>${w.deps.length ? `<span class="wdep">&larr; ${w.deps.join(',')}</span>` : ''}</div>`).join('')

  h += sec(!!d.cycle, 'Runs', 'cycle exists',

    + (d.requeued ? `<div style="font-size:10.5px;color:var(--faint)" data-recovery-prior-attempts="1">prior attempt &times;2 — manifest carries <code>previous_failure_modes: requeued-from-failed</code>; prior cycle logs rotated</div>` : '')
    + (!d.cycle && !d.requeued ? '<span style="color:var(--faint);font-size:11px">no cycle recorded</span>' : ''));

  h += sec(true, 'Demo', 'always',
    `<button class="btn small grey" data-link="demo-builder" style="background:none;color:var(--run-link);text-decoration:underline;padding:0">demo builder &rarr;</button>`);

  h += sec(unplanned, 'Plan trigger', 'pending &amp; unplanned',
    `<button class="btn" data-action="plan-initiative" data-initiative-id="${d.id}">Plan &rarr;</button>`);

  h += sec(canStart, 'Start development', 'pending &amp; ready &amp; planned',
    `<button class="btn green" data-action="start-development" data-initiative-id="${d.id}">Start development &rarr;</button>`);

  h += sec(recoverable, 'Recovery', 'in-flight / ready-for-review / failed',
    `<div data-recovery-item data-recovery-initiative="${d.id}" data-recovery-status="${st.queue}" data-recovery-attempt-count="${d.requeued ? 2 : 1}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:10px;color:var(--faint)">${d.requeued ? '&times;2 attempts' : '&times;1 attempt'}</span>
        <span style="display:flex;gap:6px">
          <button class="btn small grey" data-action="recovery-inspect">Inspect</button>
          <button class="btn small" data-action="recovery-requeue">Requeue</button>
          <button class="btn small red" data-action="recovery-abandon">Abandon</button>
        </span>
      </div>
      <div class="recovery-empty" data-section="recovery-detail" data-recovery-detail-initiative="${d.id}">Inspect to load branch / worktree / PR-draft detail.</div>
    </div>`);

  h += `<div class="inventory"><div class="slabel" style="margin-bottom:4px">Relocation inventory — nothing lost from RoadmapDag.tsx</div>` +
    [['deps line','data-initiative-id + Depends on'],
     ['blocked-by','data-blocked-by + data-section=initiative-blocked'],
     ['WI badges','data-work-item-id (topo order)'],
     ['run links','data-run-link / data-run-cycle-id / data-run-active'],
     ['plan trigger','data-action=plan-initiative + data-plan-state'],
     ['start development','data-action=start-development'],
     ['recovery','data-recovery-* + inspect/requeue/abandon + detail region'],
     ['demo builder','data-link=demo-builder']]
    .map(([a,b]) => `<div class="row"><span class="ok">&#10003;</span><span style="min-width:120px">${a}</span><code>${b}</code></div>`).join('')
    + `</div>`;

  h += `</div>`;
  return h;
}

// ---- comment markers ----
function initMarkers(prefix, markers){
  let pop = document.getElementById('cm-pop');
  if (!pop){
    pop = document.createElement('div');
    pop.id = 'cm-pop';
    document.body.appendChild(pop);
    pop.addEventListener('click', ev => ev.stopPropagation());   // allow copying the text
    document.addEventListener('click', () => { pop.style.display = 'none'; });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') pop.style.display = 'none'; });
  }
  document.querySelectorAll('.cm').forEach(el => {
    const key = el.dataset.cm;
    const m = markers[key];
    if (!m || el.dataset.cmWired) return;
    el.dataset.cmWired = '1';
    el.textContent = key.replace(prefix, '');
    el.title = m[0];
    el.setAttribute('aria-label', 'Decision point ' + key + ': ' + m[0]);
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (pop.style.display === 'block' && pop.dataset.for === key){ pop.style.display = 'none'; return; }
      pop.innerHTML = `<div class="pid">${key}</div><div class="pq">${m[0]}</div><div>${m[1]}</div>`;
      pop.dataset.for = key;
      const r = el.getBoundingClientRect();
      pop.style.display = 'block';
      pop.style.left = Math.min(r.left, innerWidth - 390) + 'px';
      pop.style.top = Math.min(r.bottom + 8, innerHeight - 200) + 'px';
    });
  });
}
function legendHTML(prefix, markers){
  return `<div class="legend"><h3 style="font-size:15px;margin-bottom:4px">Decision points — comment with the marker id</h3>
  <p style="font-size:12px;color:var(--faint);margin:0 0 12px">Reference a marker id (e.g. <code>${prefix}2</code>) in your artifact comment. Violet circles on the page mark where each decision lives.</p>
  <div class="scrollx"><table><tr><th>id</th><th>Decision</th><th>Context</th></tr>` +
  Object.entries(markers).map(([k, m]) =>
    `<tr><td class="mid">${k}</td><td class="q">${m[0]}</td><td>${m[1]}</td></tr>`).join('') +
  `</table></div></div>`;
}


const MARKERS = {
  B1: ['Rank wrapping: 5 columns for the 29-card rank?', 'A pure rank-per-column layout is what broke — 29 cards in one column. Here any rank wider than 8 wraps into a 5-column grid. Wrapping trades edge cleanliness (edges now cross sibling cards) for a usable aspect ratio. Right k? Wrap threshold?'],
  B2: ['Edge policy at 66 edges: all faint at rest, bold on selection?', 'All 66 real edges render at 20% opacity; hovering or selecting a node bolds its edges and lights neighbors. The 23-edge fan-in to Mux-free cutover and the 23-edge fan-out from the release-folder-permissions hub are the stress test — click either. Alternative: no edges at rest (A&rsquo;s answer), or bundle parallel edges.'],
  B3: ['Does the minimap earn its place?', 'At 51 nodes the world is ~3&times; the viewport at readable zoom. The minimap shows the whole shape plus your viewport, and click-jumps. Cost: one more moving part to maintain. Keep, or rely on fit-to-view?'],
  B4: ['Wheel = zoom: acceptable scroll capture?', 'The canvas captures the wheel for zoom (like every node editor — FlowBuilderCanvas already behaves this way in Studio). Page scrolling still works outside the canvas. Alternative: ctrl+wheel to zoom, wheel to pan.'],
  B5: ['Expansion: inline on-canvas (this mock) or reuse A&rsquo;s drawer?', 'The plan notes A&rsquo;s drawer + card are 100% reusable by B. This mock expands the selected node inline on the canvas — detail lives where the geometry is, but reflows the rank and can cover edges. A drawer would keep the canvas stable. Which reads better?'],
  B6: ['If B wins: dagre/elkjs is a NEW dependency — ask-first', 'This mock hand-rolls the rank layout (depth ranks + grid wrap; no measuring, coordinates are known). Production B on reactflow@11 (already a dep via FlowBuilderCanvas) would want a real layout engine for edge routing — that is a new dependency requiring explicit approval per CLAUDE.md.'],
};


const CW = 240, CH = 64, GX = 14, GY = 14, RANK_GAP = 170, WRAP_AT = 8, K = 5;
const W_EXP = 380, H_EXP = 1000;          // expanded-node footprint reserved in layout
let MODE = 'replay', SELECTED = MUX_ID, tx = 40, ty = 30, scale = 1;
let pos = {}, worldW = 0, worldH = 0;

function layout(){
  pos = {}; worldW = 0; worldH = 0;
  const ranks = {};
  DATA.forEach(d => (ranks[d.depth] = ranks[d.depth] || []).push(d));
  let x = 0;
  Object.keys(ranks).map(Number).sort((a,b)=>a-b).forEach(dep => {
    // hub-last within rank so heavy fan-out leaves from the rank's right edge
    const g = ranks[dep].slice().sort((a, b) => a.fanOut - b.fanOut || a.ord - b.ord);
    const k = g.length > WRAP_AT ? K : (g.length > 6 ? 2 : 1);
    const rowH = {};
    g.forEach((d, i) => {
      const row = Math.floor(i / k);
      rowH[row] = Math.max(rowH[row] || 0, d.id === SELECTED ? H_EXP : CH);
    });
    g.forEach((d, i) => {
      const col = i % k, row = Math.floor(i / k);
      const w = (d.id === SELECTED) ? W_EXP : CW;
      const px = x + col * (CW + GX);
      let py = 0;
      for (let r2 = 0; r2 < row; r2++) py += (rowH[r2] || CH) + GY;
      pos[d.id] = { x: px, y: py, w, h: d.id === SELECTED ? H_EXP : CH, rank: dep };
      worldW = Math.max(worldW, px + w);
      worldH = Math.max(worldH, py + pos[d.id].h);
    });
    x += k * (CW + GX) - GX + RANK_GAP;
  });
}
function render(){
  layout();
  const nodesEl = document.getElementById('nodes');
  const nb = SELECTED ? neighborsOf(SELECTED) : { up: new Set(), down: new Set() };
  nodesEl.innerHTML = DATA.map(d => {
    const p = pos[d.id];
    if (d.id === SELECTED)
      return `<div class="detail bnode-expanded" style="left:${p.x}px;top:${p.y}px;width:${W_EXP}px" data-expanded-node="${d.id}">${detailHTML(d, MODE)}</div>`;
    return cardHTML(d, MODE);
  }).join('');
  // position + highlight collapsed cards (style attr in cardHTML only carries the tone)
  DATA.forEach(d => {
    if (d.id === SELECTED) return;
    const el = nodesEl.querySelector(`[data-initiative-id="${d.id}"]`);
    const p = pos[d.id];
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; el.style.width = CW + 'px'; el.style.height = CH + 'px';
    if (nb.up.has(d.id) || nb.down.has(d.id)) el.classList.add('neighbor');
    else if (SELECTED) el.classList.add('dimmed');
  });
  drawEdges();
  drawMinimap();
  document.getElementById('world').style.width = worldW + 'px';
  document.getElementById('world').style.height = worldH + 'px';
  nodesEl.querySelectorAll('.icard').forEach(el =>
    el.addEventListener('click', ev => { ev.stopPropagation(); SELECTED = el.dataset.initiativeId; render(); }));
  nodesEl.querySelectorAll('[data-dep-jump]').forEach(el =>
    el.addEventListener('click', ev => { ev.stopPropagation(); SELECTED = el.dataset.depJump; render(); }));
  initMarkers('B', MARKERS);
  applyTransform();
}
function drawEdges(){
  const svg = document.getElementById('edges');
  svg.setAttribute('width', worldW); svg.setAttribute('height', worldH);
  const nb = SELECTED ? neighborsOf(SELECTED) : null;
  let out = '';
  DATA.forEach(d => d.deps.forEach(p => {
    const a = pos[p], b = pos[d.id];
    const x1 = a.x + a.w, y1 = a.y + Math.min(a.h, CH) / 2, x2 = b.x, y2 = b.y + Math.min(b.h, CH) / 2;
    const hot = SELECTED && (d.id === SELECTED || p === SELECTED);
    const dx = Math.max(40, (x2 - x1) / 2);
    out += `<path data-dep-edge data-dep-from="${p}" data-dep-to="${d.id}"
      d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}" fill="none"
      stroke="${hot ? 'var(--run-link)' : 'var(--line)'}" stroke-width="${hot ? 2 : 1.2}"
      stroke-opacity="${hot ? 0.95 : (SELECTED ? 0.12 : 0.25)}"/>`;
  }));
  svg.innerHTML = out;
}
function drawMinimap(){
  const mm = document.getElementById('minimap');
  const mw = 200, mh = Math.max(80, Math.round(mw * worldH / worldW));
  mm.style.height = mh + 'px';
  const s = mw / worldW;
  let out = '';
  DATA.forEach(d => {
    const p = pos[d.id];
    const st = statusOf(d, MODE);
    out += `<div class="mm-node" style="left:${p.x * s}px;top:${p.y * s}px;width:${Math.max(2, p.w * s)}px;height:${Math.max(2, Math.min(p.h, CH) * s)}px;background:${TONE[st.queue]};opacity:.8"></div>`;
  });
  mm.innerHTML = out + '<div id="mm-view"></div>';
  updateMmView();
  mm.onclick = ev => {
    const r = mm.getBoundingClientRect();
    const wx = (ev.clientX - r.left) / s, wy = (ev.clientY - r.top) / s;
    const vp = document.getElementById('viewport');
    tx = vp.clientWidth / 2 - wx * scale; ty = vp.clientHeight / 2 - wy * scale;
    applyTransform();
  };
}
function updateMmView(){
  const vp = document.getElementById('viewport'), v = document.getElementById('mm-view');
  if (!v) return;
  const s = 200 / worldW;
  v.style.left = (-tx / scale * s) + 'px';
  v.style.top = (-ty / scale * s) + 'px';
  v.style.width = (vp.clientWidth / scale * s) + 'px';
  v.style.height = (vp.clientHeight / scale * s) + 'px';
}
function applyTransform(){
  document.getElementById('world').style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  updateMmView();
}
function fit(){
  const vp = document.getElementById('viewport');
  scale = Math.min((vp.clientWidth - 60) / worldW, (vp.clientHeight - 60) / worldH, 1.2);
  tx = (vp.clientWidth - worldW * scale) / 2;
  ty = (vp.clientHeight - worldH * scale) / 2;
  applyTransform();
}
const vp = document.getElementById('viewport');
let panning = null;
vp.addEventListener('mousedown', ev => {
  if (ev.target.closest('.icard,.detail,#minimap,.cm,button,a')) return;
  panning = { x: ev.clientX - tx, y: ev.clientY - ty };
  vp.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (!panning) return;
  tx = ev.clientX - panning.x; ty = ev.clientY - panning.y;
  applyTransform();
});
window.addEventListener('mouseup', () => { panning = null; vp.classList.remove('panning'); });
vp.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = vp.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.min(2, Math.max(0.15, scale * f));
  tx = mx - (mx - tx) * (ns / scale); ty = my - (my - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}, { passive: false });
document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(2, scale * 1.25); applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.15, scale / 1.25); applyTransform(); });
document.getElementById('zoom-fit').addEventListener('click', fit);
document.getElementById('collapse-all').addEventListener('click', () => { SELECTED = null; render(); });
function setMode(m){
  MODE = m;
  document.getElementById('mode-replay').setAttribute('aria-pressed', String(m === 'replay'));
  document.getElementById('mode-today').setAttribute('aria-pressed', String(m === 'today'));
  render();
}
document.getElementById('mode-replay').addEventListener('click', () => setMode('replay'));
document.getElementById('mode-today').addEventListener('click', () => setMode('today'));
document.getElementById('legend-slot').innerHTML = legendHTML('B', MARKERS);
render();
fit();

</script>
