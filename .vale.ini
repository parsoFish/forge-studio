# Vale lints the published docs pages (apps/docs) for banned content: decision
# records, campaign ids, history narration, filler and future promises
# everywhere; test attributes and source paths on guides too. Google and
# write-good add general style; only error-level alerts gate. The landing
# page (index.mdx) takes the guides' styles. Generated
# how-tos (guides/how-to/) are out of scope: their words come from the story
# files and are fixed there, never on the page.
StylesPath = apps/docs/vale
MinAlertLevel = error
Vocab = Forge
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip

[apps/docs/src/content/docs/guides/*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good, Forge

[apps/docs/src/content/docs/index.mdx]
BasedOnStyles = Vale, Google, write-good, Forge

[apps/docs/src/content/docs/reference/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good, Forge
Forge.DataAttributes = NO
Forge.InternalPaths = NO

[apps/docs/src/content/docs/guides/how-to/*.{md,mdx}]
BasedOnStyles =
