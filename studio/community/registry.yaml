# Community registry (W6-CR-1; schema v2 since W8-B5) — the declared-list
# SOURCE OF TRUTH for community items forge showcases in its OOTB library,
# superseding studio/catalog.yaml's now-removed `community-skills:` section.
#
# SCHEMA v2 — repo facts are keyed by REPO, not copied onto every item.
# `stars`, `upstreamUpdatedAt`, `fetchedAt` and `fetchedBy` describe an
# upstream REPOSITORY, and v1 gave each item its own copy of them: nine items
# here share only five distinct `sourceUrl`s, so one repo's star count was
# written onto N rows and the copies drifted. They now live ONCE in the
# top-level `sources:` map, keyed by a normalized source key derived from
# `sourceUrl` (orchestrator/studio/community-source-url.ts), and are resolved
# at read time. An item carries only what is genuinely per-item curation:
# identity, category, source URL, provenance, recommended tier and
# `signals.attributedTo`. Writing `stars:` on an item is now a LOAD ERROR —
# the row has nowhere to hold a mis-scoped copy.
#
# WHAT v2 RETIRED, on purpose, so nobody reads it as an accidental loss: the
# `pre-impl-interview` row carried `starsDisplay: "156k installs"` plus two
# inline comments explaining that "156k installs" is NOT a star count. Under
# v2 that annotation is structural instead of prose — that row's source is a
# blog post, which resolves to no repo, so it simply has no star signal at
# all and reads honestly unrefreshed. The figure and its two comment lines
# retire with the field they annotated.
#
# `fetchedBy: seed` means hand-curated and never fetched. A row only becomes
# `api:github` / `api:npm` / `api:mcp-registry` when `forge community refresh`
# actually received a 200 for it; a failed, rate-limited or 404'd fetch leaves
# the source row byte-identical rather than stamping it fresh.
#
# `meta.lastRefresh` stays null until a refresh pass has actually run.
#
# NOTE FOR EDITORS: comments inside the `items:` block cannot survive a
# programmatic write (js-yaml has no comment round-trip), so `forge studio
# lint` refuses them. This header block IS preserved verbatim by
# `serializeCommunityRegistry` — put rationale here.
#
# Read by orchestrator/studio/registry.ts's `loadCommunityRegistry` /
# `communitySkillsFromRegistry` — see that module for the schema's structural
# enforcement (required fields, kind vocab, signals shape, retired fields).
meta:
  schemaVersion: 2
  lastRefresh: null

sources:
  "github:anthropics/skills":
    stars: 151000
    starsDisplay: "151k"
    upstreamUpdatedAt: null
    fetchedAt: null
    fetchedBy: seed
  "github:obra/superpowers":
