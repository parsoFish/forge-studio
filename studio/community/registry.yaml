# Community registry (W6-CR-1) — the declared-list SOURCE OF TRUTH for
# community items forge showcases in its OOTB library, superseding
# studio/catalog.yaml's now-removed `community-skills:` section.
#
# Every fact in `items[]` below is hand-curated (fetchedBy: seed) — the same
# discipline studio/catalog.yaml's community-skills section followed before
# this migration: `which forge agents actually compose a skill` stays DERIVED
# from real agent composition.skills (never declared here, see
# orchestrator/studio/skill-library.ts's deriveSkillUsage); nothing here is a
# verified LIVE signal from the upstream host — `signals.stars` is parsed only
# where the curated display string is unambiguously a pure k/M-notation number
# (e.g. "228k" → 228000); a display string that names a different unit (e.g.
# "156k installs") is NOT a star count and is left `stars: null` — never
# fabricated — while `starsDisplay` still preserves the original curated text
# verbatim for rendering.
#
# `meta.lastRefresh` stays null until a real automated refresh pass exists —
# this migration seeds data only, it does not add a refresh mechanism.
#
# Read by orchestrator/studio/registry.ts's `loadCommunityRegistry` /
# `communitySkillsFromRegistry` — see that module for the schema's structural
# enforcement (required fields, kind vocab, signals shape).
