id: basic
name: Basic Flow
version: 1
goal: Plan a change, implement it, and review the result before it merges.
project: null
kb: null
costCeilingUsd: 5
origin: starter
# Seam F6 half 1 (ADR 051 decision 4): the New-Flow canvas seeds a fresh flow
# from this template — accepting every class keeps the seed permissive; the
# operator narrows `accepts` once they know what their own flow is for.
accepts: [code, docs, config, infra]
nodes:
  - { id: plan, agent: plan }
  - { id: dev, agent: dev }
  - { id: review, agent: review, gate: verdict }
edges:
  - { from: plan, to: dev, artifact: plan }
  - { from: dev, to: review, artifact: pr }
triggers: []
