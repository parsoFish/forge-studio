# studio/session-kinds.yaml
#
# The typed session-kind registry (R2-10, PR1) backing the operator-facing
# session shell. Each entry describes one interactive session surface: which
# agent drives it, which legacy Studio routes it replaces, which of the six
# SESSION_STAGES (a CLOSED vocabulary — see orchestrator/studio/session-kinds.ts)
# it can occupy, and which artifact renderer displays its output.
#
# Loaded by loadSessionKinds()/validateSessionKinds() — a bare top-level YAML
# SEQUENCE of descriptors (not a mapping). R4-15/16/17 extend this registry by
# ADDING A DESCRIPTOR here (not a new page) plus, when they ship, a renderer
# for any new artifact.kind those descriptors need — the session shell is
# generic over whatever is declared in this file.

- id: architect
  agent: architect
  title: Planning session
  legacyRoutes:
    - /architect/[sessionId]
    - /architect/[sessionId]/interview
  stages: [roadmap]
  defaultStage: roadmap
  artifact:
    kind: roadmap-draft
    label: Roadmap draft

- id: instructions
  agent: instructions-creator
  title: Instructions session
  legacyRoutes:
    - /instructions/[sessionId]
  stages: [instructions]
  defaultStage: instructions
  artifact:
    kind: markdown-draft
    label: AGENTS.md draft

- id: project-brain
  agent: project-brain-builder
  title: Brain creation session
  legacyRoutes:
    - /project-brain/[sessionId]
  stages: [brain]
  defaultStage: brain
  artifact:
    kind: brain-structure
    label: Seeded structure

# R4-16: id is "demo" — NOT "demo-builder" — because the bridge derives the
# session dir as <projectsRoot>/<project>/_<descriptor.id>/<sessionId>, and
# real demo-builder sessions live under _demo/<sid> (demoSessionDir,
# orchestrator/demo-builder-runner.ts). "demo-builder" would resolve
# _demo-builder/ and 404 for every real session.
# legacyRoutes is deliberately [] — /demo/[sessionId] exists but is a
# redirect stub to the PROJECT PAGE (R1-03-F2), not a route the session
# shell replaces; declaring it here would misstate R1-03-F2.
- id: demo
  agent: demo-builder
  title: Demo capability session
  legacyRoutes: []
  stages: [demo]
  defaultStage: demo
  artifact:
    kind: generation-gallery
    label: Demo generations

# R4-17 — the onboarding session. id is "onboarding" — the bridge derives the
# session dir as <projectsRoot>/<project>/_<descriptor.id>/<sessionId>
# (cli/bridge-studio-sessions.ts), and the new POST /api/studio/onboarding/
# start route creates exactly <projectsRoot>/<project>/_onboarding/<sid>/, so
# the descriptor id must match that literal directory-name prefix, same rule
# as "demo" above.
# legacyRoutes is deliberately [] — there was no predecessor onboarding
# session ROUTE at all before this initiative: onboarding-agent
# (skills/onboarding-agent/SKILL.md) was a fire-and-forget POST /api/agents/
# :slug/run dispatch with no session dir, no status.json, no turns (spec
# evidence #3, _wave5/specs/R4-17.md). There is nothing for this kind to
# legacy-replace.
# This descriptor is REUSED, not duplicated, for project CREATION too (D1) —
# the mockup gives SESSIONS['project-onboarding'] and SESSIONS['create-project']
# the SAME artifact ('contract-full') and the SAME label ("Contract
# build-out"; mockups/studio-endstate-v2/data.jsx:485-531). A second
# `create-project` descriptor would need its own `agent:` to resolve to a
# runtime-bearing SKILL.md (validateSessionKinds' unknown-agent check), and no
# creation agent exists anywhere in the roster (`grep -l '^runtime:'
# skills/*/SKILL.md` names 16 agents, none of which authors projects) —
# inventing one just to satisfy a second descriptor would be exactly the
# fabricated-mapping shape R2-10's D3 already refused once for a different
# stage. Reusing this one descriptor for both flows is what the AC's literal
# wording ("Creation (R4-03) reuses the same stages") asks for.
- id: onboarding
  agent: onboarding-agent
  title: Onboarding session
  legacyRoutes: []
  stages: [contract, instructions, secrets, demo, roadmap]
  defaultStage: contract
  artifact:
    kind: contract-buildout
    label: Contract build-out

# R4-21 — the authoring session (creation-agent). A single-stage session:
# 'authoring' is SESSION_STAGES's first-ever extension (session-kinds.ts),
# added purely to back this descriptor — unrelated to the ordered onboarding
# sequence the other six stage tokens encode. legacyRoutes is deliberately
# [] — there was no predecessor authoring session ROUTE at all before this
# initiative (creation-agent is new). artifact.kind is 'file-package' — the
# session's accumulating draft skill/hook package (deriveFilePackage reads
# the session dir's own staging/ subdirectory).
#
# turnSpec (R4-21 phase 2, WI-1, D1) is ADR-043 §1's ratified table verbatim
# (docs/decisions/043-generic-interactive-surface.md#1-the-primitive--one-
# additive-optional-turnspec-field) — the ADR's own worked example IS this
# descriptor. kindDir is the one SEC-04 containment segment
# (resolveGuardedPath(projectRoot, [kindDir, sessionId])); style:agent picks
# runAgentTurn. Four phases: analyzing (runs the agent, writes staging/,
# advances to awaiting-review) -> awaiting-review (operator review, noop) ->
# committing (runs the copyStagingToLibrary finalizer, advances to committed)
# -> committed (terminal).
- id: authoring
  agent: creation-agent
  title: Authoring session
  legacyRoutes: []
  stages: [authoring]
  defaultStage: authoring
  artifact:
    kind: file-package
    label: Package
  turnSpec:
    kindDir: _authoring
    style: agent
    phases:
      - { phase: analyzing, step: agent, writes: [staging], next: awaiting-review }
      - { phase: awaiting-review, step: noop }
      - { phase: committing, step: finalize, finalizer: copyStagingToLibrary, next: committed }
      - { phase: committed, step: terminal }

# R4-19-F2 — the kb-cleanup session (brain-maintenance, cleanup-plan). Drafts
# a reviewable cleanup plan from one KB's agent-tier brain-lint findings
# (skills/brain-maintenance/SKILL.md) and stops for operator approval; a
# separate route (POST /api/studio/kbs/:id/cleanup/apply) drains the
# approved plan. legacyRoutes is deliberately [] — there was no predecessor
# kb-cleanup session ROUTE at all before this initiative.
#
# `id` MUST equal the `_<kindDir>` directory prefix without its leading
# underscore (`kb-cleanup` <-> `_kb-cleanup`) — the bridge derives the
# on-disk session dir as `<projectsRoot>/<project>/_<descriptor.id>/<sid>`
# (cli/bridge-studio-sessions.ts) while the generic turn runner derives it
# independently as `<projectRoot>/<turnSpec.kindDir>/<sid>`
# (orchestrator/interactive-runner.ts's `resolveGuardedPath(projectRoot,
# [turnSpec.kindDir, sessionId])`) — a mismatch here would silently split one
# session across two different directories, one for reads and one for turns.
#
# `legacyRoutes: []` is legal per validateSessionKinds (an empty list is
# never itself an error, AT-51) and, as above, honestly reflects that this
# session replaces no prior Studio page.
#
# `awaiting-approval` deliberately declares NO `next` key at all — that
# ABSENCE *is* the approval gate. The generic runner (runInteractiveTurn)
# treats a `noop` phase as a true no-op: re-running the turn while a session
# sits at `awaiting-approval` leaves `status.phase` (and the whole session
# dir) byte-for-byte unchanged, so a duplicate/retried turn dispatch can
# never auto-advance an unapproved plan into `applied`. `applied` is written
# by exactly one caller — the dedicated apply route
# (POST /api/studio/kbs/:id/cleanup/apply) — after it independently checks
# `phase === 'awaiting-approval'` itself; the ordinary turn-dispatch path
# (`forge agent run kb-cleanup ...`) never writes it. Adding a `next` here
# would silently defeat the whole approval-gate feature.
- id: kb-cleanup
  agent: brain-maintenance
  title: KB cleanup session
  legacyRoutes: []
  stages: [brain]
  defaultStage: brain
  artifact:
    kind: cleanup-plan
    label: Cleanup plan
  turnSpec:
    kindDir: _kb-cleanup
    style: agent
    phases:
      - { phase: drafting, step: agent, writes: [plan], next: awaiting-approval }
      - { phase: awaiting-approval, step: noop }
      - { phase: applied, step: terminal }
