# studio/session-kinds.yaml
#
# The typed session-kind registry (R2-10, PR1) backing the operator-facing
# session shell. Each entry describes one interactive session surface: which
# agent drives it, which legacy Studio routes it replaces, which of the six
# SESSION_STAGES (a CLOSED vocabulary — see orchestrator/studio/session-kinds.ts)
# it can occupy, and which artifact renderer displays its output.
#
# Loaded by loadSessionKinds()/validateSessionKinds() — a bare top-level YAML
# SEQUENCE of descriptors (not a mapping). R4-15/16/17 extend this registry by
# ADDING A DESCRIPTOR here (not a new page) plus, when they ship, a renderer
# for any new artifact.kind those descriptors need — the session shell is
# generic over whatever is declared in this file.

# legacyRoutes is deliberately [] as of W6-IA-8 — the two prior entries
# (/architect/[sessionId], /architect/[sessionId]/interview) named
# forge-ui/app/ page directories that implemented the redirect themselves;
# both were PURE path-shape moves (the destination is knowable from the URL
# alone), so policy converted them to next.config.mjs `redirects()` entries
# and deleted the page directories outright. `legacyRoutes`/`legacyRouteResolves`
# (this file's own header comment, orchestrator/studio/session-kinds.ts) model
# ONLY a forge-ui/app/ route directory — a next.config.mjs wire redirect is a
# structurally different mechanism, so the honest value here is now `[]`,
# same as every other kind below with no live forge-ui/app/ predecessor. The
# old paths still work (see next.config.mjs); collectSessionRows
# (cli/ui-bridge.ts) falls back to the modern `/sessions/architect/<sid>` href
# for freshly-generated session rows, which is a strict improvement — no
# redirect hop on internally-generated links.
- id: architect
  agent: architect
  title: Planning session
  legacyRoutes: []
  stages: [roadmap]
  defaultStage: roadmap
  artifact:
    kind: roadmap-draft
    label: Roadmap draft

# legacyRoutes is deliberately [] as of W6-IA-8 — /instructions/[sessionId]
# was a pure path-shape move (destination knowable from the URL alone),
# converted to a next.config.mjs `redirects()` entry with its page directory
# deleted outright (see the "architect" descriptor above for the full
# rationale — same policy, same mechanism).
- id: instructions
  agent: instructions-creator
  title: Instructions session
  legacyRoutes: []
  stages: [instructions]
  defaultStage: instructions
  artifact:
    kind: markdown-draft
    label: AGENTS.md draft
  # panel (W6-B3, ADR-043 2026-08-15 amendment §2) — the read-only affordance
  # twin of instructions-runner.ts's real state machine (its own header
  # comment, orchestrator/instructions-runner.ts:17-24). instructions never
  # gains a turnSpec (2026-08-14 amendment §1 — it is never migrated onto the
  # primitive), so this is its ONLY source of derivable affordances.
  panel:
    phases:
      # orchestrator/instructions-runner.ts:18, runInterviewStep (agent turn,
      # orchestrator/instructions-runner.ts:310) — branches (needs input ->
      # awaiting-answers; ready -> drafting), so no single `next` here.
      - { phase: interviewing, step: agent }
      # orchestrator/instructions-runner.ts:18 — the interview Q&A checkpoint.
      # awaits:questions — this IS the interview Q&A checkpoint the operator
      # answers. The answer -> interviewing transition is written by
      # cli/ui-bridge.ts:3264 (POST /api/instructions/answer,
      # `{ ...status, phase: 'interviewing', round: round + 1 }`), NOT
      # orchestrator/instructions-runner.ts:247 (which writes the OPPOSITE
      # entry, drafting/interviewing -> awaiting-answers, when the agent turn
      # itself decides it needs more input).
      - { phase: awaiting-answers, step: noop, awaits: questions, next: interviewing }
      # orchestrator/instructions-runner.ts:20-21, runDraftStep (agent turn,
      # orchestrator/instructions-runner.ts:373) — writes the AGENTS.md draft
      # (orchestrator/instructions-runner.ts:457), advances to awaiting-verdict.
      - { phase: drafting, step: agent, writes: [draft], next: awaiting-verdict }
      # orchestrator/instructions-runner.ts:21-23 — operator decision point
      # (bridge: approve -> finalizing; revise -> drafting; reject ->
      # rejected), no single `next` (3-way branch). awaits:verdict — an
      # approve/revise/reject decision, not a Q&A checkpoint.
      - { phase: awaiting-verdict, step: noop, awaits: verdict }
      # orchestrator/instructions-runner.ts:21, runFinalizeStep (deterministic
      # write via withStudioWrite, orchestrator/instructions-runner.ts:464,491;
      # no agent call), advances to committed.
      - { phase: finalizing, step: finalize, finalizer: writeToRepoRoot, next: committed }
      # orchestrator/instructions-runner.ts:21 — terminal.
      - { phase: committed, step: terminal }
      # orchestrator/instructions-runner.ts:23 — terminal.
      - { phase: rejected, step: terminal }

# legacyRoutes is deliberately [] as of W6-IA-8 — /project-brain/[sessionId]
# was a pure path-shape move (destination knowable from the URL alone, its
# `?project=` query forwarded automatically by Next's redirect passthrough),
# converted to a next.config.mjs `redirects()` entry with its page directory
# deleted outright (see the "architect" descriptor above for the full
# rationale — same policy, same mechanism).
- id: project-brain
  agent: project-brain-builder
  title: Brain creation session
  legacyRoutes: []
  stages: [brain]
  defaultStage: brain
  artifact:
    kind: brain-structure
    label: Seeded structure

# R4-16: id is "demo" — NOT "demo-builder" — because the bridge derives the
# session dir as <projectsRoot>/<project>/_<descriptor.id>/<sessionId>, and
# real demo-builder sessions live under _demo/<sid> (demoSessionDir,
# orchestrator/demo-builder-runner.ts). "demo-builder" would resolve
# _demo-builder/ and 404 for every real session.
# legacyRoutes is deliberately [] as of W6-B10 — /demo/[sessionId] is now a
# next.config.mjs wire redirect (like architect/instructions/project-brain
# above), not a forge-ui/app/ page directory, so it cannot be declared here
# (legacyRouteResolves — this file's own header comment,
# orchestrator/studio/session-kinds.ts — checks a REAL page directory).
# Before W6-B10 it was a data-dependent client shim redirecting to the
# PROJECT PAGE (R1-03-F2's inline DemoBuilderPanel); R1-03-F2 is now
# REVERSED (docs/roadmaps/R1-contract-componentry.md) — the demo builder is
# this dedicated session screen, the same one every other interactive kind
# shares, not an inline panel.
- id: demo
  agent: demo-builder
  title: Demo capability session
  legacyRoutes: []
  stages: [demo]
  defaultStage: demo
  artifact:
    kind: generation-gallery
    label: Demo generations
  # panel (W6-B3, ADR-043 2026-08-15 amendment §2) — the read-only affordance
  # twin of demo-builder-runner.ts's real state machine (its own header
  # comment, orchestrator/demo-builder-runner.ts:15-20). demo never gains a
  # turnSpec (2026-08-14 amendment §1 — it is never migrated onto the
  # primitive), so this is its ONLY source of derivable affordances.
  panel:
    phases:
      # W6-B10 — every demo session is MINTED at this phase (POST
      # /api/demo-builder/start, cli/ui-bridge.ts, always writes
      # `phase: 'briefing'`) — without this row, a session opened at
      # `/sessions/demo/<sid>` before this batch derived ZERO affordances
      # (the phase table had no matching row at all) and the operator could
      # never get the agent started from the dedicated screen. `awaits:
      # questions` renders the generic free-text box (SessionInteractivePanel)
      # exactly the way `demoBuilderBrief`/`SessionBriefing` did inline;
      # `handleDemoBrief` (cli/bridge-studio-affordances.ts) mirrors
      # `POST /api/demo-builder/brief` (cli/ui-bridge.ts) — same prompt.md
      # write, same phase -> generating transition. No `next:` here — the
      # write itself advances the phase, exactly like every other
      # `awaits:questions`/`awaits:verdict` row in this registry.
      - { phase: briefing, step: noop, awaits: questions }
      # orchestrator/demo-builder-runner.ts:16, runGenerateStep (agent turn,
      # orchestrator/demo-builder-runner.ts:279) — writes DEMO.html + the
      # generator skill (orchestrator/demo-builder-runner.ts:402), advances to
      # awaiting-review.
      - { phase: generating, step: agent, writes: [demo], next: awaiting-review }
      # orchestrator/demo-builder-runner.ts:16 — operator decision point
      # (bridge: feedback -> generating; lock -> locking; abandon ->
      # abandoned), no single `next` (3-way branch). awaits:verdict — a
      # feedback/lock/abandon decision, not a Q&A checkpoint.
      - { phase: awaiting-review, step: noop, awaits: verdict }
      # orchestrator/demo-builder-runner.ts:19, runLockStep (deterministic —
      # "record the locked demo for reproducibility",
      # orchestrator/demo-builder-runner.ts:405-409; no agent call).
      - { phase: locking, step: finalize, finalizer: recordLockedDemo, next: locked }
      # orchestrator/demo-builder-runner.ts:19 — terminal.
      - { phase: locked, step: terminal }
      # orchestrator/demo-builder-runner.ts:20 — terminal (bridge: abandon,
      # from awaiting-review).
      - { phase: abandoned, step: terminal }

# R4-17 — the onboarding session. id is "onboarding" — the bridge derives the
# session dir as <projectsRoot>/<project>/_<descriptor.id>/<sessionId>
# (cli/bridge-studio-sessions.ts), and the new POST /api/studio/onboarding/
# start route creates exactly <projectsRoot>/<project>/_onboarding/<sid>/, so
# the descriptor id must match that literal directory-name prefix, same rule
# as "demo" above.
# legacyRoutes is deliberately [] — there was no predecessor onboarding
# session ROUTE at all before this initiative: onboarding-agent
# (skills/onboarding-agent/SKILL.md) was a fire-and-forget POST /api/agents/
# :slug/run dispatch with no session dir, no status.json, no turns (spec
# evidence #3, _wave5/specs/R4-17.md). There is nothing for this kind to
# legacy-replace.
# This descriptor is REUSED, not duplicated, for project CREATION too (D1) —
# the mockup gives SESSIONS['project-onboarding'] and SESSIONS['create-project']
# the SAME artifact ('contract-full') and the SAME label ("Contract
# build-out"; mockups/studio-endstate-v2/data.jsx:485-531). A second
# `create-project` descriptor would need its own `agent:` to resolve to a
# runtime-bearing SKILL.md (validateSessionKinds' unknown-agent check), and no
# creation agent exists anywhere in the roster (`grep -l '^runtime:'
# skills/*/SKILL.md` names 16 agents, none of which authors projects) —
# inventing one just to satisfy a second descriptor would be exactly the
# fabricated-mapping shape R2-10's D3 already refused once for a different
# stage. Reusing this one descriptor for both flows is what the AC's literal
# wording ("Creation (R4-03) reuses the same stages") asks for.
- id: onboarding
  agent: onboarding-agent
  title: Onboarding session
  legacyRoutes: []
  stages: [contract, instructions, secrets, demo, roadmap]
  defaultStage: contract
  artifact:
    kind: contract-buildout
    label: Contract build-out
  # panel (W6-B3, ADR-043 2026-08-15 amendment §2) — the read-only affordance
  # twin of onboarding's real phase vocabulary. Unlike the other three panel
  # kinds, onboarding is NOT a turn-loop (ADR-043 §Consequences: "onboarding
  # is explicitly out of scope... it runs through `forge agent dispatch` + a
  # different path") — it is a fire-and-forget dispatch with exactly three
  # phase values, so this table is genuinely thin, not truncated.
  panel:
    phases:
      # written by POST /api/studio/onboarding/start when the dispatch begins
      # (cli/ui-bridge.ts:3504, `{ phase: 'running', ... }`); the
      # onboarding-agent turn itself is the "agent" step
      # (skills/onboarding-agent/SKILL.md). Branches to complete or failed, so
      # no single `next` here.
      - { phase: running, step: agent }
      # terminal, written by writeSessionTerminalPhase(forgeRoot, sessionDir,
      # 'complete') when `forge agent dispatch --session-dir` observes the run
      # finish (cli/agent-run.ts:198, called at cli/agent-run.ts:420,440).
      - { phase: complete, step: terminal }
      # terminal, written by writeSessionTerminalPhase(forgeRoot, sessionDir,
      # 'failed') (cli/agent-run.ts:198, called at cli/agent-run.ts:460).
      - { phase: failed, step: terminal }

# R4-21 — the authoring session (creation-agent). A single-stage session:
# 'authoring' is SESSION_STAGES's first-ever extension (session-kinds.ts),
# added purely to back this descriptor — unrelated to the ordered onboarding
# sequence the other six stage tokens encode. legacyRoutes is deliberately
# [] — there was no predecessor authoring session ROUTE at all before this
# initiative (creation-agent is new). artifact.kind is 'file-package' — the
# session's accumulating draft skill/hook package (deriveFilePackage reads
# the session dir's own staging/ subdirectory).
#
# turnSpec (R4-21 phase 2, WI-1, D1) is ADR-043 §1's ratified table verbatim
# (docs/decisions/043-generic-interactive-surface.md#1-the-primitive--one-
# additive-optional-turnspec-field) — the ADR's own worked example IS this
# descriptor. kindDir is the one SEC-04 containment segment
# (resolveGuardedPath(projectRoot, [kindDir, sessionId])); style:agent picks
# runAgentTurn. Four phases: analyzing (runs the agent, writes staging/,
# advances to awaiting-review) -> awaiting-review (operator review, noop) ->
# committing (runs the copyStagingToLibrary finalizer, advances to committed)
# -> committed (terminal).
- id: authoring
  agent: creation-agent
  title: Authoring session
  legacyRoutes: []
  stages: [authoring]
  defaultStage: authoring
  artifact:
    kind: file-package
    label: Package
  turnSpec:
    kindDir: _authoring
    style: agent
    phases:
      - { phase: analyzing, step: agent, writes: [staging], next: awaiting-review }
      # verdicts (W6-B6 post-merge review): approve-only — there is no
      # rejection path for a drafted package (the operator either commits it
      # or leaves the session sitting here); the write route
      # (cli/bridge-studio-affordances.ts) 422s a reject against this SAME
      # authored list, never a hardcoded per-kind table.
      - { phase: awaiting-review, step: noop, awaits: verdict, verdicts: [approve] }
      - { phase: committing, step: finalize, finalizer: copyStagingToLibrary, next: committed }
      - { phase: committed, step: terminal }

# R4-19-F2 — the kb-cleanup session (brain-maintenance, cleanup-plan). Drafts
# a reviewable cleanup plan from one KB's agent-tier brain-lint findings
# (skills/brain-maintenance/SKILL.md) and stops for operator approval; a
# separate route (POST /api/studio/kbs/:id/cleanup/apply) drains the
# approved plan. legacyRoutes is deliberately [] — there was no predecessor
# kb-cleanup session ROUTE at all before this initiative.
#
# `id` MUST equal the `_<kindDir>` directory prefix without its leading
# underscore (`kb-cleanup` <-> `_kb-cleanup`) — the bridge derives the
# on-disk session dir as `<projectsRoot>/<project>/_<descriptor.id>/<sid>`
# (cli/bridge-studio-sessions.ts) while the generic turn runner derives it
# independently as `<projectRoot>/<turnSpec.kindDir>/<sid>`
# (orchestrator/interactive-runner.ts's `resolveGuardedPath(projectRoot,
# [turnSpec.kindDir, sessionId])`) — a mismatch here would silently split one
# session across two different directories, one for reads and one for turns.
#
# `legacyRoutes: []` is legal per validateSessionKinds (an empty list is
# never itself an error, AT-51) and, as above, honestly reflects that this
# session replaces no prior Studio page.
#
# `awaiting-approval` deliberately declares NO `next` key at all — that
# ABSENCE *is* the approval gate. The generic runner (runInteractiveTurn)
# treats a `noop` phase as a true no-op: re-running the turn while a session
# sits at `awaiting-approval` leaves `status.phase` (and the whole session
# dir) byte-for-byte unchanged, so a duplicate/retried turn dispatch can
# never auto-advance an unapproved plan into `applied`. `applied` is written
# by exactly one caller — the dedicated apply route
# (POST /api/studio/kbs/:id/cleanup/apply, and its generic W6-B4 sibling
# POST /api/studio/sessions/kb-cleanup/:sid/awaiting-approval-verdict, both
# funneling through the ONE shared `approveKbCleanup`,
# cli/bridge-studio-kbs.ts) — after it independently checks
# `phase === 'awaiting-approval'` itself; the ordinary turn-dispatch path
# (`forge agent run kb-cleanup ...`) never writes it. Adding a `next` here
# would silently defeat the whole approval-gate feature.
#
# `applying` (W6-B4 adversarial-review fix, closing a live-reproduced
# double-drain race): the ATOMIC CLAIM `approveKbCleanup` writes
# SYNCHRONOUSLY — no `await` — the instant it observes `awaiting-approval`,
# strictly BEFORE the awaited `enqueueConsolidate` drain runs. A second
# concurrent approve then reads `applying`, not `awaiting-approval`, and
# 409s instead of ALSO running the drain (the pre-fix repro: two concurrent
# approves produced two independent `runBrainConsolidateNow` runs, two
# `_brainfix-<runId>` log dirs). Like `applied`, this row is UNREACHABLE via
# any `next` in this table (nothing points `next: applying` at it) —
# `approveKbCleanup` is its only writer, exactly mirroring how `applied`
# itself has always been written outside the `next` graph. `step: terminal`
# here is not a claim that the session has finished (it has not — the very
# next write is `applied`); it is the one TURN_STEPS value that makes
# `deriveSessionAffordances` correctly derive ZERO affordances while a claim
# is in flight, matching the row's real semantics ("nothing is currently
# writable here") without inventing a fifth step kind.
- id: kb-cleanup
  agent: brain-maintenance
  title: KB cleanup session
  legacyRoutes: []
  stages: [brain]
  defaultStage: brain
  artifact:
    kind: cleanup-plan
    label: Cleanup plan
  turnSpec:
    kindDir: _kb-cleanup
    style: agent
    phases:
      - { phase: drafting, step: agent, writes: [plan], next: awaiting-approval }
      # verdicts (W6-B6 post-merge review): approve-only — same reasoning as
      # `awaiting-approval` deliberately declaring no `next` above: there is
      # no rejection semantics anywhere in this repo for a cleanup plan. The
      # write route 422s a reject against this SAME authored list.
      - { phase: awaiting-approval, step: noop, awaits: verdict, verdicts: [approve] }
      - { phase: applying, step: terminal }
      - { phase: applied, step: terminal }

# W6-CR-3 — the community-refresh session (community-refresh agent). The
# operator-triggered agent that EXTENDS studio/community/registry.yaml (the
# W6-CR-1 source of truth the Studio community browser reads) from live
# sources on demand — the registry never fetches itself; this session is how
# an operator asks for a verified pass. `id`/`kindDir` follow the SAME rule
# stated on `kb-cleanup` above: `id` MUST equal the `_<kindDir>` directory
# prefix without its leading underscore (`community-refresh` <->
# `_community-refresh`).
#
# `stages: [community]` — the vocabulary's SECOND extension (session-kinds.ts,
# mirroring 'authoring's own R4-21 precedent): a single-stage session with no
# natural fit among the ordered onboarding sequence the other six tokens
# encode.
#
# artifact.kind is 'file-package' — REUSED from `authoring` (ADR-043's own
# "prefer reuse" discipline), not a new reserved row: the session's
# `staging/` directory holds exactly a small, reviewable file package
# (`registry.yaml` + `evidence.md`), the same shape `deriveFilePackage`
# already renders generically for any turnSpec kind's staging/ dir.
#
# turnSpec: `gathering` runs the agent (writes the draft package to
# `staging/`) -> `awaiting-review` (operator verdict; UNLIKE kb-cleanup/
# authoring, this row allows BOTH `approve` and `reject` — there is a real,
# meaningful "discard this draft" action here, since a refresh pass may
# propose changes the operator does not want committed) -> `committing` runs
# the `commitRegistryDraft` finalizer (orchestrator/interactive-finalizers.ts)
# -> `committed` (terminal). `rejected` is its OWN terminal row, reached
# directly from `awaiting-review` by the generic affordance write route
# (cli/bridge-studio-affordances.ts) on a `reject` verdict — never through
# `committing`, so a rejected draft never touches the real registry at all.
- id: community-refresh
  agent: community-refresh
  title: Community refresh session
  legacyRoutes: []
  stages: [community]
  defaultStage: community
  artifact:
    kind: file-package
    label: Registry draft
  turnSpec:
    kindDir: _community-refresh
    style: agent
    phases:
      - { phase: gathering, step: agent, writes: [staging], next: awaiting-review }
      - { phase: awaiting-review, step: noop, awaits: verdict, verdicts: [approve, reject] }
      - { phase: committing, step: finalize, finalizer: commitRegistryDraft, next: committed }
      - { phase: committed, step: terminal }
      - { phase: rejected, step: terminal }
