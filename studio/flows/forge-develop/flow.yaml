id: forge-develop
name: Forge Develop
version: 2
goal: Take a decomposed initiative's work items to a reviewed, merged PR — developer fan-out, demo, adversarial review, verdict.
project: null
kb: cycles
costCeilingUsd: 25
origin: seed
# DEC-3 (S7): the second of the three flows that replace the forge-cycle
# monolith. Architect (forge-architect) decomposes; Develop builds → demos →
# reviews; Reflect (S8) captures the brain. DEC-2: a Develop run threads the SAME
# initiativeId + cycle_id the architect flow minted, so cost/roadmap/metrics
# (and the WI hexes pm already emitted) roll up under one _logs/<cycleId>.
#
# R4-10-F1 (ADR-039/040): the monolithic unifier node is retired from the live
# flow in favour of the two Q3-B successor agents on the R2 engine —
#   dev → demo → adversarial-review → verdict
# `demo` (the `demo-band`, skills/demo-agent) authors demo.json + the relocated
# `.forge/pr-description.md` and carries the dev-loop close contract (boundary
# commit, sync invariant, empty-branch guard, final CI gate); `adversarial-review`
# (the `review-band`, skills/adversarial-review) critiques the diff into the
# `review-findings` artifact the operator weighs at the verdict gate. Every
# post-develop fix loop — demo AC-miss, verdict send-back — re-dispatches the ONE
# develop executor via orchestrator-band re-entry (resume_from:'develop',
# drain-fix-loop.ts); the flow stays a DAG as data (no back-edges). The demo node
# is `resumable` — it is the resume target once dev's per-WI commits are on the
# branch. `execUnifier`/the `developer-unifier` slug stay in the registry until
# R4-01-F4 retires them, but are no longer on this flow.
#
# `dev` is the flow's entry node, so it carries NO `fanOut:` — the lint rule
# requires a fanOut artifact to be fed by an inbound edge, and an entry node
# has none. The per-WI fan-out is unchanged at runtime: runDeveloperLoop walks
# the work items pm already wrote, and the WI hexes derive from the dev-loop
# events in the shared cycle log (not from this static topology hint).
nodes:
  - { id: dev, agent: developer-ralph }
  - { id: demo, agent: demo-agent, resumable: true }
  - { id: adversarial-review, agent: adversarial-review }
  - { id: review, gate: verdict }
edges:
  - { from: dev, to: demo, artifact: wi-branches }
  - { from: demo, to: adversarial-review, artifact: pr }
  - { from: adversarial-review, to: review, artifact: review-findings }
# Declaration-driven reflect trigger (ADR-041 target shape). Develop terminates
# at `ready-for-review` (PR open), BEFORE merge, so the flow-runner (which fires
# `on: flow-complete`) deliberately skips this `on: merged` trigger. The real
# merge signal is async + post-run: orchestrator/finalize-merged.ts reads THIS
# declaration and dispatches the standalone reflect agent once the merged PR is
# confirmed. R4-09-F1: the target is the reflect AGENT (resolved via its
# `reflection-close` band guard), not a flow wrapper — the shipped shape is a
# standalone agent (W7-C1 retired the vestigial single-node flow wrapper).
# Single source of "merge fires reflect" = this line (no hardcoded runReflector).
triggers:
  - { on: merged, target: { kind: agent, ref: reflector } }
# Stage C — per-flow kickoff. Develop is launched by selecting a planned,
# dependency-ready initiative (the initiative-select surface).
kickoff: { kind: initiative-select }
