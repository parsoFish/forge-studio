---
name: GitWeave Apply

'on':
  push:
    branches: ["main"]
    paths:
      - "config/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    name: Apply Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install copier pyyaml jsonschema

      - name: Apply Overlays
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/apply-overlays.py config/repos/
