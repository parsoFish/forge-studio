services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gitweave
      POSTGRES_PASSWORD: gitweave
      POSTGRES_DB: gitweave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitweave -d gitweave"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://gitweave:gitweave@postgres:5432/gitweave
    depends_on:
      postgres:
        condition: service_healthy

  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://gitweave:gitweave@postgres:5432/gitweave
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
